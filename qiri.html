<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>和平会议 · 七日</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='9' fill='%239c1f1a'/><g stroke='%23f3f1ea' stroke-width='7' fill='none' stroke-linecap='square'><path d='M14 20h36M34 20v19c0 8-5 11-13 11'/></g></svg>">
<style>
:root{
  --paper:#e9e6df; --paper2:#f2efe8; --ink:#141312; --ink2:#3a3733;
  --faint:#8c877e; --line:#c9c4b9; --seal:#9c1f1f; --seal2:#c2352f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"SimSun",serif;
  font-size:16px;line-height:1.85;letter-spacing:.02em;padding:0 0 70px;
}
.wrap{max-width:780px;margin:0 auto;padding:0 22px}
header{border-bottom:1px solid var(--line);padding:24px 0 14px;position:relative}
h1{font-size:23px;letter-spacing:.3em;margin:0 0 6px;font-weight:600}
.sub{font-size:12px;color:var(--faint);letter-spacing:.26em}
.seal{position:absolute;right:0;top:18px;width:52px;height:52px;border:2px solid var(--seal);
  color:var(--seal);border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1.15;transform:rotate(4deg);text-align:center}
.prog{margin:14px 0 6px}
.prog .row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--faint);letter-spacing:.14em}
.prog .bar{flex:1;height:6px;background:#ddd8cd;border:1px solid var(--line);position:relative}
.prog .bar i{display:block;height:100%;background:var(--ink2);width:0}
.prog .bar-accent i{background:var(--seal)}
.daybar{display:flex;margin:12px 0 4px;border:1px solid var(--line);background:var(--paper2);font-size:11.5px}
.daybar div{flex:1;text-align:center;padding:6px 0;color:var(--faint);border-right:1px solid var(--line);letter-spacing:.06em}
.daybar div:last-child{border-right:none}
.daybar div.on{background:var(--ink);color:var(--paper)}
.daybar div.done{color:var(--ink2)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--ink2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;margin:10px 0 20px;letter-spacing:.04em}
.stats b{font-weight:600}
.stats .flag{color:var(--seal)}
.card{background:var(--paper2);border:1px solid var(--line);padding:19px 21px;margin:0 0 16px}
.card .tag{font-size:11.5px;color:var(--faint);letter-spacing:.2em;margin-bottom:8px}
.card h2{font-size:17px;margin:0 0 13px;letter-spacing:.09em;font-weight:600}
.card p{margin:0 0 11px}
.card p:last-child{margin-bottom:0}
.q{border-left:3px solid var(--seal);padding:2px 0 2px 13px;color:var(--ink2);margin:13px 0;font-size:15.5px}
.said{margin:0 0 9px}
.said b{font-weight:600}
.mini{font-size:13.5px;color:var(--faint);margin:10px 0 0}
table.seat{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 10px}
table.seat td{border-bottom:1px dotted var(--line);padding:6px 4px;vertical-align:top}
table.seat td:first-child{color:var(--faint);width:9.5em;white-space:nowrap;letter-spacing:.06em}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
button{font-family:inherit;font-size:14.5px;letter-spacing:.05em;cursor:pointer;
  background:var(--paper);border:1px solid var(--ink2);color:var(--ink);padding:10px 18px;transition:.15s}
button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.main{background:var(--seal);border-color:var(--seal);color:#fff}
button.main:hover{background:var(--seal2);border-color:var(--seal2)}
button.ghost{border-color:var(--line);color:var(--faint)}
.choice{display:block;width:100%;text-align:left;margin:0 0 9px;padding:12px 15px;line-height:1.7}
.delta{font-size:12.5px;color:var(--seal);letter-spacing:.05em;margin-top:13px}
.log{border-top:1px solid var(--line);margin-top:24px;padding-top:15px}
.log h3{font-size:13px;letter-spacing:.22em;color:var(--faint);margin:0 0 11px;font-weight:400}
.log .item{font-size:13.5px;color:var(--ink2);padding:6px 0;border-bottom:1px dotted var(--line)}
.log .item:last-child{border-bottom:none}
.end h2{font-size:20px;letter-spacing:.15em}
.end .rank{font-size:12px;color:var(--seal);letter-spacing:.28em;margin:6px 0 17px}
.note{font-size:13px;color:var(--faint);line-height:1.8;margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.src{font-size:11.5px;color:var(--faint);line-height:1.95}
.src b{color:var(--ink2);font-weight:600}
footer{text-align:center;font-size:11.5px;color:var(--faint);letter-spacing:.2em;margin-top:36px}
@media (max-width:560px){
  body{font-size:15.5px}.wrap{padding:0 15px}
  h1{font-size:19px;letter-spacing:.22em}.seal{width:44px;height:44px;font-size:11px}
  .card{padding:15px}table.seat{font-size:12.5px}table.seat td:first-child{width:7.5em}
}

/* ══ 移动端补丁（追加在最后；只改观感与命中区，不动剧情、数值与判定）══
   桌面浏览器上这些几乎看不出差别，但手机上差别很大：
   双击不再有 300ms 延迟、点击不闪灰块、按钮有 44px 命中区、
   触摸时有 :active 反馈（原来只有 :hover，触摸设备上从不触发）、
   底部固定控制条不会被 iPhone 的小白条压住。 */
html,body{-webkit-text-size-adjust:100%;}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,[role="button"],.choice,.origin,.tab,
a.btn,.opt{cursor:pointer;touch-action:manipulation;min-height:44px;
  -webkit-tap-highlight-color:transparent;}
button:active:not(:disabled),.choice:active,.origin:active,.tab:active,
a.btn:active,.opt:active{filter:brightness(.93);}
.controls{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
.jump{bottom:calc(var(--ctl-h, 96px) + 14px + env(safe-area-inset-bottom,0px));}

  </style>
</head>

<div class="wrap">
  <header>
    <h1>和平会议 · 七日</h1>
    <div class="sub">黑柩 · 北沙 · 外传</div>

<script>

  if (!S.reported.length) return "";
  return '<div class="log"><h3>你报上去的话</h3>' + S.reported.map(function (r) {
    return '<div class="item">第 ' + r.day + " 日　" + esc(r.log) + "</div>";
  }).join("") + "</div>";
}
function srcTable() {
  return '<div class="note src">' +
    "<b>本作的事实来源</b><br>" +
    "<b>【考据】</b>八席名单、姓名牌、餐会开场、十大纲领、林村长当众忏悔、电视处决（第二批是真枪毙）、" +
    "三印邀请函、高领私信、叶心的张伯伦类比、镜缘「猫会后空翻」、镜缘「重庆」那句 —— 出自《第九季下·再聚》原始记录<br>" +
    "<b>【考据】</b>防火墙在会议期间开放、会后重启并宣布第二轮大清算 —— 出自设定集卷四《清算法》条<br>" +
    "<b>【考据】</b>高领的「天上之战」纵火方案、「这些人都算进去了」 —— 出自设定集高领条<br>" +
    "<b>【考据】</b>镜缘服药、「不会乱抓人了」、深夜打游戏被骂队友 —— 出自花絮总集<br>" +
    "<b>【考据】</b>西娜·陈的对外宣传部线与对内夺权线 —— 分别出自设定集与实录；本作按作者裁决以实录为主<br>" +
    "<b>【考据】</b>洪黎以警局／宪特身份参会、叶心「您已经站在了悬崖」 —— 出自设定集<br>" +
    "<b>【考据】</b>叶心在会后仍活跃（西沙 97 次／食龙则肥 26 次／竖棺 14 次） —— 出自三份场次志<br>" +
    "<b>【推演】</b>山道地形、门禁与安检、上菜路线、KTV 包房 —— 据设定合理延伸<br>" +
    "<b>【原创】</b>听差、管事、杂役，以及支线的具体触发与后果 —— 本作虚构<br>" +
    "</div>";
}

function start() {
  S.day = 1;
  S.trust = { qingdu: 0, beisha: 0, zhongfen: 0, nihon: 0 };
  S.fire = 0; S.feast = 0; S.chair = 0;
  S.paper = false; S.lies = 0; S.nameIdx = 0; S.xina = 0;
  S.story = []; S.reported = []; S.ending = null;
  renderDay();
}

function renderDay() {
  var d = DAYS[S.day - 1];
  if (!d) return renderEnd();
  if (d.n === 7) return renderSign();
  var h = bar() + prog(d) + trustLine();
  h += card("第 " + d.n + " 日 · " + d.date, d.title, d.open);
  if (d.extra === "seat") h += seatTable();
  if (d.extra === "ten") h += tenTable();
  h += '<div class="card"><div class="tag">在洋馆里</div>';
  d.scenes.forEach(function (s) {
    h += '<p class="said"><b>' + esc(s.who) + "：</b>" + esc(s.txt) + "</p>";
    h += '<p class="q">' + esc(s.note) + "</p>";
  });
  h += "</div>";
  h += '<div class="card"><div class="tag">差事</div><h2>' + esc(d.task.ask) + "</h2>" +
    choiceList(d.task.opts, "task") + "</div>";
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function renderSign() {
  var d = DAYS[6];
  var h = bar() + prog(d) + trustLine();
  h += card("第 7 日 · " + d.date, d.title, d.open);
  h += '<div class="card"><div class="tag">在洋馆里</div>';
  d.scenes.forEach(function (s) {
    h += '<p class="said"><b>' + esc(s.who) + "：</b>" + esc(s.txt) + "</p>";
    h += '<p class="q">' + esc(s.note) + "</p>";
  });
  h += "</div>";
  h += '<div class="card"><div class="tag">名单</div><h2>' + esc(d.task.ask) + "</h2>" +
    choiceList(d.task.opts, "sign") + "</div>" + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function task(i) {
  var d = DAYS[S.day - 1], o = d.task.opts[i];
  applyOpt(o);
  var h = bar() + prog(d) + trustLine();
  h += card("第 " + d.n + " 日 · " + d.date, d.title, d.open);
  h += '<div class="card"><div class="tag">你做完了差事</div><h2>' + esc(o.log) + "</h2>" +
    "<p>管事听完，点了点头。他在册子上写了一行，没有让你看。</p></div>" + deltaLine(o);
  if (o.dark) {
    h += '<div class="card"><div class="tag">她把话说完了</div><h2>「如果你出了事，我就会把你人头挂在我洋馆门头上当装饰。」</h2>' +
      "<p>她说这句话的时候还在笑。笑完她就走了。</p>" +
      '<p class="q">「要么听话，要么死。」——她对你说的第一句真话。</p></div>';
  }
  if (d.xina) {
    h += '<div class="card"><div class="tag">会外 · 一间小屋</div><h2>' + esc(d.xina.ask) + "</h2>" +
      choiceList(d.xina.opts, "xina") + "</div>" + renderLog();
    $("app").innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }
  if (d.night) {
    h += '<div class="card"><div class="tag">第六日 · 深夜</div><h2>' + esc(d.night.ask) + "</h2>" +
      choiceList(d.night.opts, "night") + "</div>" + renderLog();
    $("app").innerHTML = h;
    window.scrollTo(0, 0);
    return;
  }
  h += '<div class="btns"><button class="main" onclick="toReport()">去 回 话</button></div>' + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function xina(i) {
  var d = DAYS[4], o = d.xina.opts[i];
  applyOpt(o);
  var h = bar() + prog(d) + trustLine();
  h += '<div class="card"><div class="tag">会外 · 一间小屋</div><h2>' + esc(o.log) + "</h2>" +
    "<p>你把茶盘端走了。小屋的门一直没关严，也没有人出来叫你。</p></div>" + deltaLine(o);
  h += '<div class="btns"><button class="main" onclick="toReport()">去 回 话</button></div>' + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function night(i) {
  var d = DAYS[5], o = d.night.opts[i];
  applyOpt(o);
  var h = bar() + prog(d) + trustLine();
  h += '<div class="card"><div class="tag">第六日 · 深夜</div><h2>' + esc(o.log) + "</h2>" +
    "<p>廊下的灯只有一盏是亮的。你在灯下站了一会儿。</p></div>" + deltaLine(o);
  h += '<div class="btns"><button class="main" onclick="toReport()">天 亮 了</button></div>' + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function toReport() {
  var d = DAYS[S.day - 1];
  var h = bar() + prog(d) + trustLine();
  h += '<div class="card"><div class="tag">回话</div><h2>' + esc(d.report.ask) + "</h2>" +
    choiceList(d.report.opts, "report") + "</div>" + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function report(i) {
  var d = DAYS[S.day - 1], o = d.report.opts[i];
  applyOpt(o);
  if (o.leak) {
    var other = { beisha: "qingdu", qingdu: "beisha", zhongfen: "beisha" }[o.leak];
    if (other) S.trust[other] = (S.trust[other] || 0) - 1;
  }
  S.reported.push({ day: S.day, log: o.log });
  var h = bar() + prog(d) + trustLine();
  h += '<div class="card"><div class="tag">你报上去的</div><h2>' + esc(o.log) + "</h2>" +
    "<p>管事听完，点了点头。他在册子上写了一行，没有让你看。</p></div>" + deltaLine(o);
  if (o.leak) {
    h += '<div class="card"><div class="tag">第二天</div><h2>有人知道你说了什么</h2>' +
      "<p>「公布私下的谈话，只会破坏我们之间的政治默契。」——这句话不是对你说的人说的，是你在走廊上听见的。</p></div>";
  }
  h += '<div class="btns"><button class="main" onclick="next()">次 日</button></div>' + renderLog();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function next() {
  S.day++;
  renderDay();
}

function applyOpt(o) {
  if (o.t) for (var k in o.t) S.trust[k] = (S.trust[k] || 0) + o.t[k];
  if (o.lie) S.lies++;
  if (o.chair) S.chair = o.chair;
  if (o.feast) S.feast = Math.max(S.feast, o.feast);
  if (o.fire) S.fire = Math.max(S.fire, o.fire);
  if (o.paper) S.paper = true;
  if (o.xina) S.xina = Math.max(S.xina || 0, o.xina);
  if (o.story) S.story.push(o.story);
}
function deltaLine(o) {
  var dl = [];
  if (o.t) for (var k in o.t) {
    var nm = { qingdu: "青都", beisha: "北沙", zhongfen: "中分山", nihon: "日本街" }[k];
    if (o.t[k]) dl.push(nm + (o.t[k] > 0 ? " +" : " ") + o.t[k]);
  }
  if (o.fire === 2) dl.push("山道：已报");
  if (o.fire === 1) dl.push("山道：未报");
  if (o.chair === 2) dl.push("统领席：撤了");
  return dl.length ? '<div class="delta">' + esc(dl.join("　")) + "</div>" : "";
}

function sign(i) {
  var d = DAYS[6], o = d.task.opts[i];
  S.nameIdx = i;
  applyOpt(o);
  S.reported.push({ day: 7, log: o.log });
  renderEnd();
}

function renderEnd() {
  var end = null;
  for (var k = 0; k < ENDINGS.length; k++) {
    if (ENDINGS[k].hit(S)) { end = ENDINGS[k]; break; }
  }
  S.ending = end;
  var h = bar() + trustLine();
  h += '<div class="card end"><div class="tag">卷宗</div><div class="rank">' + esc(end.rank) + "</div>" +
    "<h2>" + esc(end.name) + "</h2>" +
    end.body.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
    '<p class="q">' + esc(end.note) + "</p></div>";
  var sum = [
    "青都 " + S.trust.qingdu, "北沙 " + S.trust.beisha,
    "中分山 " + S.trust.zhongfen, "日本街 " + S.trust.nihon,
    "前后不一 " + S.lies + " 次",
    "山道：" + (S.fire === 0 ? "不知" : (S.fire === 1 ? "知道但没报" : "知道并报了")),
    "饰华：" + (S.feast === 0 ? "不知" : (S.feast === 1 ? "听见了" : "说出去过")),
    "统领席：" + (S.chair === 2 ? "撤了" : "摆着"),
    "报纸：" + (S.paper ? "带下山" : "没留"),
    "会外那件事：" + ((S.xina || 0) === 0 ? "没听见" : ((S.xina || 0) >= 2 ? "说出去过" : "只报了一半"))
  ];
  h += '<div class="note">' + esc(sum.join("　·　")) + "</div>";
  if (S.story.length) h += '<div class="note">支线　' + esc(S.story.join("　·　")) + "</div>";
  h += renderLog();
  h += '<div class="btns"><button class="main" onclick="start()">再 来 一 次</button>' +
    '<button class="ghost" onclick="renderIntro()">回到开头</button></div>';
  h += '<div class="note">本作有九个结局。判定分三层：先看特殊事件（山道／报纸／饰华／前后不一），' +
    "再看关系（三方／日本街／一边），最后是兜底。</div>";
  h += srcTable();
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function renderIntro() {
  $("app").innerHTML =
    card("序", "天寨洋馆", [
      "战后五年四月，和平会议在中分山开。地方叫中分山天寨洋馆——是大当家镜缘的住处。",
      "来的人很多。餐会大厅里摆着巨幅动态壁画。武裝人员一律禁止进入大厅，都在洋馆外巡逻。每张餐桌前有一块姓名牌。",
      "你是洋馆里的一个听差。开会的时候你不在席上，你在走廊、楼梯口、以及上菜的过道上。",
      "你会听到很多话。每天结束的时候，会有人来问你。",
      "你报上去的话，会让某一方多信你一点，也会让某一方少信你一点。七天之后，看谁记得你。"
    ]) +
    '<div class="btns"><button class="main" onclick="start()">进 山</button></div>' +
    '<div class="note">本作以正史为主线；第六日之后有一条平行线——那条线里，山真的烧起来过。</div>' +
    srcTable();
}

renderIntro();
</script>



</body>
</html>
