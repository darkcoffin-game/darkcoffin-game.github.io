<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黑柩·命途转盘 · 北沙 · 白色恐怖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='9' fill='%239c1f1a'/><g stroke='%23f3f1ea' stroke-width='7' fill='none' stroke-linecap='square'><path d='M21 14v36M43 14v36M21 32h22'/></g></svg>">
<style>
/* ══════════════════════════════════════════════════════════
   北沙篇 · 白色恐怖
   纸白为底、墨黑为字、印泥朱红为唯一强调色。
   ══════════════════════════════════════════════════════════ */
:root{
  --paper:#e9e6df;      /* 纸 */
  --paper2:#f4f2ec;     /* 更亮的纸 */
  --ink:#141312;        /* 墨 */
  --ink2:#3c3a36;
  --dim:#6c6862;
  --faint:#9a958c;
  --rule:#c4bfb4;
  --rule2:#a8a29a;
  --red:#9c1f1a;        /* 印泥 */
  --red2:#c2352c;
  --redbg:#f3e6e3;
  --steel:#4a5560;      /* 冷灰，用于档案 */
  --ok:#3f5c3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,rgba(20,19,18,.022) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(20,19,18,.018) 0 1px,transparent 1px 6px);
  color:var(--ink);
  min-height:100vh;min-height:100dvh;
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
  font-size:16px;line-height:1.8;letter-spacing:.02em;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 108px}

/* ── 报头 ── */
.head{position:relative;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:14px 0 12px;margin-bottom:16px;text-align:center}
.head h1{margin:0;font-size:clamp(21px,4.8vw,32px);letter-spacing:.34em;text-indent:.34em;
  color:var(--ink);font-weight:600}
.head .sub{margin-top:6px;font-size:11.5px;letter-spacing:.34em;color:var(--dim)}
.head .stamp{position:absolute;right:2px;top:8px;width:52px;height:52px;border:2px solid var(--red);
  border-radius:3px;color:var(--red);display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1.05;letter-spacing:.06em;transform:rotate(-8deg);
  opacity:.82;text-align:center;padding:3px;font-weight:600}
.head .rule{position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--rule2)}

/* ── 副栏（报表） ── */
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:7px 14px;
  background:var(--paper2);border:1px solid var(--ink);padding:11px 13px;margin-bottom:18px}
.bar{font-size:12px;letter-spacing:.05em}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim)}
.bar .row b{color:var(--ink);font-weight:600;font-size:13.5px}
.bar .track{height:2px;background:var(--rule);margin-top:4px;overflow:hidden}
.bar .fill{height:100%;width:0;transition:width .45s ease}
.f-stance{background:var(--ink)}
.f-heat{background:var(--red)}
.f-favor{background:var(--steel)}
.f-nerve{background:#6b5f8a}
.f-body{background:#7a6a4e}
.f-cash{background:var(--ok)}
.f-month{background:var(--red)}
.bar.warn .row b{color:var(--red);}
.bar.warn .track{background:var(--redbg)}

/* ── 卷宗卡片 ── */
.log{display:flex;flex-direction:column;gap:11px}
.card{background:var(--paper2);border:1px solid var(--rule2);border-left:5px solid var(--ink2);
  padding:13px 16px;animation:rise .4s ease both;position:relative}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card .tag{font-size:10.5px;letter-spacing:.24em;color:var(--dim);margin-bottom:5px}
.card h3{margin:0 0 8px;font-size:16.5px;font-weight:600;color:var(--ink);letter-spacing:.05em}
.card p{margin:0 0 8px;color:var(--ink2);text-align:justify}
.card p:last-child{margin-bottom:0}
.card.roll{border-left-color:var(--steel)}
.card.choice{border-left-color:var(--red)}
.card.omen{border:1px solid var(--ink);border-left:5px solid var(--ink);background:#efece5}
.card.death{border:2px solid var(--red);background:var(--redbg)}
.deltas{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px dotted var(--rule2)}
.chip{font-size:11.5px;padding:1px 7px;border:1px solid var(--rule2);color:var(--dim);background:#fff}
.chip.up{color:var(--ok);border-color:#9bb096;background:#eef3ec}
  /* 悬浮跳转按钮：在顶部时显示「回到底部」，其余时候显示「回到顶部」。
     位置由 JS 量出的底栏高度 --ctl-h 决定，所以窗口缩小、底栏换行变高时也不会压住选项卡。 */
  .jump{position:fixed;right:12px;z-index:11;padding:8px 13px;
    font-size:12px;letter-spacing:.06em;color:var(--ink2);font-family:inherit;
    background:rgba(250,249,246,.94);border:1px solid #cdc7ba;border-radius:20px;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.09);backdrop-filter:blur(4px);
    transition:background .15s;
    bottom:calc(88px + 14px);
    bottom:calc(var(--ctl-h, 88px) + 14px + env(safe-area-inset-bottom, 0px))}
  .jump:hover{background:#f3f1ea}
  .jump[hidden]{display:none}
  /* 窄屏与移动端：缩成 42px 圆钮，只留箭头，半透明，尽量不挡选项 */
  @media (max-width:560px){
    .jump{width:42px;height:42px;padding:0;border-radius:50%;font-size:0;
      right:10px;opacity:.9;
      bottom:calc(96px + 8px);
      bottom:calc(var(--ctl-h, 96px) + 8px + env(safe-area-inset-bottom, 0px))}
    .jump::before{content:"\2191";font-size:16px;line-height:42px;display:block}
    .jump[data-dir="down"]::before{content:"\2193"}
  }
.chip.down{color:var(--red);border-color:#d3aaa6;background:#fbeeec}
.chip.flag{color:var(--steel);border-color:#a9b2ba;background:#eef1f4}
.quote{margin:9px 0 0;padding:7px 11px;border-left:3px solid var(--red);
  background:#fbeeec;color:#6a2b26;font-size:14.5px}

/* ── 转盘 ── */
.altar{margin:20px 0 16px;text-align:center}
.altar .caption{font-size:11.5px;letter-spacing:.3em;color:var(--dim);margin-bottom:10px}
.wheelbox{position:relative;width:min(320px,76vw);aspect-ratio:1;margin:0 auto;--r:124px}
@media(max-width:430px){.wheelbox{--r:calc(min(320px,76vw) * 0.39)}}
.wheel{position:absolute;inset:8%;border-radius:50%;border:2px solid var(--ink);
  background:
    repeating-conic-gradient(from 0deg,rgba(20,19,18,.045) 0deg 15deg,transparent 15deg 30deg),
    radial-gradient(circle at 50% 45%,#f7f5f0 0%,#e4e0d8 70%,#d8d3c9 100%);
  box-shadow:0 1px 0 #fff inset,0 2px 10px rgba(20,19,18,.12);
  transform:rotate(0deg);transition:transform 3.1s cubic-bezier(.12,.62,.05,1)}
.wheel::after{content:"";position:absolute;inset:33%;border-radius:50%;border:2px solid var(--red);
  background:var(--paper2)}
.pointer{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:0;height:0;z-index:4;
  border-left:9px solid transparent;border-right:9px solid transparent;border-top:20px solid var(--red)}
.ringnum{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);font-size:10.5px;
  letter-spacing:.3em;color:var(--faint)}
.spoke{position:absolute;left:50%;top:50%;width:1px;height:calc(var(--r) + 6px);
  background:linear-gradient(180deg,rgba(20,19,18,.05),rgba(20,19,18,.42));
  transform-origin:50% 0;pointer-events:none}
.spoke i{display:none}
.slabel{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.slabel i{position:absolute;transform:translate(-50%,-50%);font-style:normal;white-space:nowrap;
  font-size:11.5px;letter-spacing:.05em;color:var(--ink2);max-width:72px;overflow:hidden;
  text-align:center;line-height:1.2}
.slabel.landed i{color:var(--red);font-size:13px;font-weight:600}
.wheelbox.spinning .pointer{animation:tick .09s steps(2) infinite}
@keyframes tick{50%{transform:translateX(-50%) translateY(2px)}}

/* ── 控件 ── */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:linear-gradient(180deg,rgba(233,230,223,.72),rgba(233,230,223,.98) 42%);
  backdrop-filter:blur(6px);border-top:2px solid var(--ink);padding:12px 16px 14px}
.controls .inner{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font-family:inherit;font-size:14.5px;letter-spacing:.1em;cursor:pointer;
  background:var(--paper2);color:var(--ink);border:1px solid var(--ink);padding:10px 19px;
  transition:all .16s ease}
button:hover:not(:disabled){background:var(--ink);color:var(--paper2)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--red);color:#fff;border-color:var(--red)}
button.primary:hover:not(:disabled){background:#7d1713;border-color:#7d1713;color:#fff}
button.ghost{font-size:13px;padding:8px 14px;color:var(--dim);border-color:var(--rule2);
  background:transparent}
button.ghost:hover:not(:disabled){background:var(--ink2);color:var(--paper2);border-color:var(--ink2)}
.hint{max-width:1000px;margin:8px auto 0;text-align:center;font-size:11.5px;
  letter-spacing:.08em;color:var(--dim)}

/* ── 开局 ── */
.intro{background:var(--paper2);border:2px solid var(--ink);padding:22px 22px 18px;text-align:center;
  position:relative}
.intro::before{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;
  border:1px solid var(--rule);pointer-events:none}
.intro h2{margin:0 0 6px;font-size:20px;letter-spacing:.26em;font-weight:600;color:var(--ink)}
.intro .verse{color:var(--dim);font-size:14px;margin:0 0 18px;letter-spacing:.04em}
.intro .fields{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.intro label{font-size:12px;letter-spacing:.18em;color:var(--dim);display:block;
  text-align:left;margin-bottom:4px}
.intro input{font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  border:1px solid var(--ink);padding:8px 11px;width:186px;letter-spacing:.1em}
.intro input:focus{outline:none;border-color:var(--red)}
.origins{display:grid;grid-template-columns:repeat(auto-fit,minmax(182px,1fr));gap:8px;
  margin:14px 0 4px;text-align:left}
.origin{border:1px solid var(--rule2);padding:11px 12px;cursor:pointer;background:#fff;
  transition:all .16s ease;position:relative}
.origin:hover{border-color:var(--ink);background:#fbfaf7}
.origin.sel{border:2px solid var(--red);background:var(--redbg)}
.origin b{display:block;font-weight:600;color:var(--ink);font-size:15px;letter-spacing:.06em}
.origin span{display:block;font-size:12px;color:var(--dim);line-height:1.55;margin-top:4px}
.origin .trait{font-size:11.5px;color:var(--red);margin-top:6px;letter-spacing:.04em}

/* ── 结局（判决书） ── */
.finale{margin-top:22px;border:2px solid var(--ink);background:var(--paper2);padding:24px 22px;
  animation:rise .8s ease both;position:relative}
.finale::before{content:"";position:absolute;left:7px;right:7px;top:7px;bottom:7px;
  border:1px solid var(--rule);pointer-events:none}
.finale .verdict{font-size:11.5px;letter-spacing:.44em;color:var(--red);text-align:center;
  font-weight:600}
.finale h2{margin:9px 0 3px;text-align:center;font-size:clamp(23px,5.2vw,31px);font-weight:600;
  letter-spacing:.14em;color:var(--ink)}
.finale .rank{text-align:center;font-size:12.5px;letter-spacing:.22em;color:var(--dim);margin-bottom:16px}
.finale p{color:var(--ink2);text-align:justify}
.finale .stampbig{position:absolute;right:14px;top:14px;width:74px;height:74px;border:3px solid var(--red);
  color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:15px;line-height:1.05;letter-spacing:.04em;transform:rotate(-11deg);opacity:.72;
  font-weight:600;padding:4px;border-radius:4px}
.epitaph{white-space:pre-wrap;background:#fff;border:1px solid var(--rule2);border-left:4px solid var(--ink);
  padding:13px 15px;font-size:13.5px;color:var(--ink2);line-height:1.9;margin-top:14px;
  max-height:330px;overflow:auto;font-family:inherit}
.scoreline{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:16px}
.scoreline div{border:1px solid var(--rule2);padding:8px 10px;font-size:12px;color:var(--dim);background:#fff}
.scoreline div b{display:block;color:var(--ink);font-size:16.5px;font-weight:600;letter-spacing:.05em}
.note{font-size:12px;color:var(--dim);text-align:center;margin-top:14px;letter-spacing:.06em}
@media(max-width:560px){
  body{font-size:15.2px}
  .wrap{padding:12px 11px 116px}
  .card{padding:12px 13px}
  .head h1{letter-spacing:.24em;text-indent:.24em}
  .head .stamp{width:44px;height:44px;font-size:11px}
  .finale .stampbig{width:62px;height:62px;font-size:13px}
}

/* ══ 移动端补丁（追加在最后；只改观感与命中区，不动剧情、数值与判定）══
   桌面浏览器上这些几乎看不出差别，但手机上差别很大：
   双击不再有 300ms 延迟、点击不闪灰块、按钮有 44px 命中区、
   触摸时有 :active 反馈（原来只有 :hover，触摸设备上从不触发）、
   底部固定控制条不会被 iPhone 的小白条压住。 */
html,body{-webkit-text-size-adjust:100%;}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,[role="button"],.choice,.origin,.tab,
a.btn,.opt{cursor:pointer;touch-action:manipulation;min-height:44px;
  -webkit-tap-highlight-color:transparent;}
button:active:not(:disabled),.choice:active,.origin:active,.tab:active,
a.btn:active,.opt:active{filter:brightness(.93);}
.controls{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
.jump{bottom:calc(var(--ctl-h, 96px) + 14px + env(safe-area-inset-bottom,0px));}

    /* 空隙按「固定底栏高度 ＋ 悬浮按钮高度」一起算，让页底整块停在按钮上方（按钮停在 底栏+14px，高约 42px）*/


/* ══ 选项栏可以高，但内容必须让路 ══
   原来是写死 108–118px 的底边距，而选项栏的高度由内容决定（长选项时远超那个数），
   于是最后几行正文被压在栏下面、滚到底也露不出来。
   现在改成跟着量出来的 --ctl-h 走；再给栏一个上限高度并在栏内自己滚动，
   真遇到超长选项它滚自己，而不是吃掉整屏。 */
.wrap{padding-bottom:calc(var(--ctl-h, 116px) + 22px)}
.controls{max-height:56vh;max-height:56dvh;overflow:auto;-webkit-overflow-scrolling:touch}

  /* ── 身份页的"这一局可以怎么结束"（只讲哪几条线会要命，不给公式）── */
  .mech{margin:16px 0 0;padding:11px 14px;border-left:3px solid var(--red);
    background:#fbeeec;font-size:13px;line-height:1.9;color:var(--ink2);letter-spacing:.03em}
  .mech .mh{letter-spacing:.16em;color:var(--red);margin-bottom:5px}
  .mech .mf{margin-top:7px;color:var(--faint);font-size:12px}

  /* ══ 死亡线预警：条进入危险区时叠一层斜纹 ＋ 一道细边 ══
     非文字、不解释机制 —— 只把"快到了"变得看得见。
     阈值是量出来的（heat≥65 / nerve≤45 / body≤80），见 _tests/probe_death.js。 */
  .f-heat.danger,.f-nerve.danger,.f-body.danger{
    background-image:repeating-linear-gradient(45deg,rgba(20,19,18,.26) 0 3px,transparent 3px 7px);
    box-shadow:inset 0 0 0 1px var(--red)}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="stamp">北沙<br>戡乱</div>
    <h1>黑柩·命途转盘</h1>
    <div class="sub">卷 四 · 北 沙 · 白 色 恐 怖</div>
    <div class="rule"></div>
  </header>

  <section class="bars" id="bars" hidden></section>

  <section class="altar" id="altar" hidden>
    <div class="caption" id="altar-caption">命 途 之 轮</div>
    <div class="wheelbox" id="wheelbox">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div id="spokes"></div>
        <div id="spoke-labels"></div>
      </div>
      <div class="ringnum">十 二 签 · 一 命</div>
    </div>
  </section>

  <main class="log" id="log"></main>
  <div id="finale"></div>

</div>

<div class="controls" id="controls" hidden>
  <div class="inner" id="controls-inner"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
"use strict";

/* 篇目数据在下方注入；这两张表由各篇覆盖 */
let FLAG_ENDINGS = [];
/* 结局的「最早可判定日」：由事件本身的锚点决定，不是在 w5.js 里排的
     0   一般标签（派系、文救队、政治部、哨位）
     385 名册的四种下落 / 四月二十八日火场那两个令
     398 五月四日那天做了什么、第二批名单与划过自己（都在五月四日之后）
   这份表是唯一数据源：w5.js 的每条规则 gate 由 sync_gates.py 对着它生成。 */
const ENDING_GATE = { lowered: 398, offmark: 398, jam: 398, bloodhand: 398, lookedat: 398,
                      burned: 385, buried: 385, namebook: 385, keptbook: 385,
                      crossedself: 398, secondlist: 398,
                      /* ── 第七批 ── */
                      leftbehind: 385, southbound: 385, passplus: 385,
                      theboy: 398, spared: 398, swept: 398,
                      atthegate: 385, cleanman: 0,
                      signedblank: 385, bent: 385,
                      oldcomrade: 385, theledger: 385, thatletter: 385,
                      quoted: 385, themap: 385, zhongfen: 385, thewater: 385,
                      /* ── 新市民专属 ── */
                      turncoat: 0, sidestep: 0, unlisted: 0 };

/* ═══════════════════════════════════════════════════════════════
   黑柩 · 命途转盘 —— 启示录教团国篇（精简版 · 卷一）
   玩法：转盘决定命运，关键节点由玩家抉择。
   允许撤回；撤回后重转同一转盘，结果必定与上次不同。
   ═══════════════════════════════════════════════════════════════ */

/* ── 零、工具 ── */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = (o) => JSON.parse(JSON.stringify(o));
const pickInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const has = (arr, t) => arr.indexOf(t) >= 0;

/* 确定性随机（用于同一转盘内的视觉分扇，不影响结果） */
function mulberry(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6d2b79f5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}
/* 由 id 串确定地取一个「签」，用于把中性票分配到具体事件上 */
function tieBreak(ids, seed, salt) {
  const rnd = mulberry(hash(seed + "|" + salt) ^ 0x9e3779b9);
  const arr = ids.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ── 一、教团国词条资料（摘自《黑柩设定集·第一版》） ── */

/* 主题配置：换一个势力篇，只改这里与数据区即可 */
const THEME = {
  title: "黑柩·命途转盘",

const EVENTS = [];
function ev(o) { EVENTS.push(o); return o.id; }

/* 事件索引：按 id、按时段、按身份建表，供 candidates() 快速取用 */
const EVENT_BY_ID = {};
const EVENTS_BY_ERA = {};
const EVENTS_BY_REGION = {};

function indexEvents() {
  for (const k in EVENT_BY_ID) delete EVENT_BY_ID[k];
  for (const k in EVENTS_BY_ERA) delete EVENTS_BY_ERA[k];
  for (const k in EVENTS_BY_REGION) delete EVENTS_BY_REGION[k];
  for (const e of EVENTS) {
    EVENT_BY_ID[e.id] = e;
    if (e.era) {
      for (const x of e.era) {
        if (!EVENTS_BY_ERA[x]) EVENTS_BY_ERA[x] = [];
        EVENTS_BY_ERA[x].push(e);
      }
    }
    const rg = e.region || "市区";
    if (!EVENTS_BY_REGION[rg]) EVENTS_BY_REGION[rg] = [];
    EVENTS_BY_REGION[rg].push(e);
  }
  return EVENTS.length;
}

       2  本时段没出现过、但换到新档回来的有内容的卡   ← 1 空了才用
       3  本时段的无事卡                              ← 2 也空了才用
       4  都没有 —— 返回空，由 turnRoll 兜底（借别段的无事卡）
     一句话：绝不把「已经见过的东西」排在「没见过的东西」前面。 */
  const ph = eraOf(G.day).idx;
  const p = poolFor(ph);

/* ── 视觉：十二签转盘 ── */
const N_SECTORS = 12;
const UNIFORM_MAX = 12;

/* 本局的十二个签面：身份专属轮盘用身份签面，其余用通用签面 */
function spokeSet() {
  const byName = IDENTITY_SPOKES[G.originName];
  return byName || GENERAL_SPOKES;
}

function computeSpokes(cands) {
  const sorted = cands.slice().sort(function (a, b) {
    return b.w - a.w || (a.e.id < b.e.id ? -1 : 1);
  });
  const N = N_SECTORS;
  const labels = [];

  if (sorted.length <= UNIFORM_MAX) {
    /* 每根签都写清名字：指针指向哪一根，就是哪一件事 */
    const slots = [];
    for (let i = 0; i < sorted.length; i++) slots.push(sorted[i].e);
    for (let i = 0; slots.length < N; i++) slots.push(sorted[i % sorted.length].e);
    const land = Math.floor(Math.random() * slots.length);
    return { labels: slots, land: land, winner: slots[land], showLabels: true };
  }

  /* 事件多于十二件时只写扇位，指针落在哪一扇就按权重定签 */
  const total = sorted.reduce(function (s, c) { return s + c.w; }, 0);
  const alloc = sorted.map(function (c) { return c.w / total * N; });
  const base = alloc.map(function (x) { return Math.floor(x); });
  let rem = N - base.reduce(function (s, x) { return s + x; }, 0);
  const order = alloc.map(function (x, i) { return { i: i, frac: x - Math.floor(x) }; })
    .sort(function (a, b) { return b.frac - a.frac || a.i - b.i; });
  for (let k = 0; k < order.length && rem > 0; k++, rem--) base[order[k].i]++;

  const seq = [];
  const buckets = sorted.map(function (c, i) { return { e: c.e, n: base[i], w: c.w }; });
  let guard = 0;
  while (seq.length < N && guard++ < 400) {
    for (const b of buckets) {
      if (b.n > 0 && seq.length < N) { seq.push(b.e); b.n--; }
    }
  }
  while (seq.length < N) seq.push(sorted[0].e);
  const land = Math.floor(Math.random() * N);
  return { labels: seq, land: land, winner: seq[land], showLabels: true };
}

function wheelLabel(e) {
  const t = e.short || e.title || e.id;
  return t.length > 4 ? t.slice(0, 4) : t;
}

/* 身份专属签面：把十二个格子上的字换成这个身份的字 */

  if (typeof document === "undefined" || !document.querySelectorAll) return;
  const set = spokeSet();
  const labels = document.querySelectorAll("#spoke-labels .slabel i");
  if (!labels || !labels.length) return;
  for (let i = 0; i < labels.length && i < set.length; i++) {
    const t = (labels[i].textContent || "").trim();
    if (t.length <= 1) labels[i].textContent = set[i % set.length];
  }
}
function renderWheel(sp) {

function spinTo(sp, done) {
  const w = $("wheel");
  const box = $("wheelbox");
  const step = 360 / N_SECTORS;
  const jitter = (Math.random() - 0.5) * step * 0.5;
  /* 指针在正上方(0°)。要让第 land 扇的中线停在 0°，转盘需旋转 -(land*step+step/2) */
  const base = -((sp.land * step + step / 2) + jitter);
  const laps = 4 + Math.floor(Math.random() * 3);
  const cur = w.__angle || 0;
  const next = cur + (((base - cur) % 360) + 360) % 360 + 360 * laps;
  w.__angle = next;
  w.style.transition = "transform 3.1s cubic-bezier(.12,.62,.05,1)";
  w.style.transform = "rotate(" + next + "deg)";
  setTimeout(function () {
    box.classList.remove("spinning");
    const kids = $("spoke-labels").children;
    if (kids[sp.land]) {
      kids[sp.land].classList.add("landed");
      const inner = kids[sp.land].querySelector("i");
      /* 让中签的那一签亮出来、并保持水平可读 */
      inner.textContent = sp.winner.short || sp.winner.title;
      inner.style.transform = "rotate(" + (sp.land * step + step / 2) + "deg)";

function applyDelta(d) {

    if (!meta) continue;

/* 身份标签只决定「年底怎么落地」，不在中途把人结算掉 */

function storyEndingId() {
  const match = [];
  for (const fe of FLAG_ENDINGS) {
    if (G.day < (fe.from || 0)) continue;
    const gate = ENDING_GATE[fe.end] || 0;
    if (G.day < gate) continue;
    const isIdentityRule = (typeof IDENTITY_FLAGS !== "undefined") &&
      IDENTITY_FLAGS.some(function (f) { return f === fe.flag; });
    if (isIdentityRule) continue;
    if (!has(G.flags, fe.flag)) continue;
    match.push(fe);
  }
  if (!match.length) return null;
  /* 中途收束也按同一套分档随机，避免"哪条写在前面哪条赢" */
  return pickEnding(match);
}

function flagEndingCheck() {
  if (G.over) return false;
  /* 收束点：最后一段才判定；到最后一天交给收束流程 */
  if (G.day < 366) return false;
  if (G.day >= DAY_END) return false;
  const match = [];
  for (const fe of FLAG_ENDINGS) {
    /* 与 flagEndingPick 用同一套：先读条目自带的 gate，再退回 ENDING_GATE；
       条件走 endingHit，any/all/none 才会生效（否则 any/all 永远匹配不上、
       none 被忽略，组合结局的语义会写反） */
    const gate = (fe.gate !== undefined) ? fe.gate : (ENDING_GATE[fe.end] || 0);
    if (G.day < gate) continue;
    if (!endingHit(fe, G)) continue;
    match.push(fe);
  }
  if (!match.length) return false;
  if (Math.random() > endingChance(G.day)) return false;
  finish(pickEnding(match));
  return true;
}

/* 收束概率：日子越靠后越容易落定。
   三条硬约束：
     1  第 398 日（战后五年五月四日）与第 399 日（清场）必须播得到；
     2  第 408 日（结算之前）必须留出机会 —— 所以第 408 日之前一律不判；
     3  第 425 日（结算日）一定落地，曲线在第 415 日就抬到 1.00。
   历史：最早是"过了第 396 日每转 45%"，中位结束 383、五月四日只有 10% 的人见得到；
        后来改成从第 401 日起判，仍然把「结算之前」压到 4%（锚点被普通转盘抽走的 bug
        修掉之后才看见）。现在把整条曲线推到第 408 日之后。 */
function endingChance(d) {
  if (d < 408) return 0;
  if (d >= DAY_END) return 1;
  const p = [0.12, 0.22, 0.35, 0.50, 0.65, 0.80, 0.90, 1.00];
  return p[Math.min(p.length - 1, d - 408)];
}

function endingWeight(fe) {
  /* 单旗标 / any / all 里取最高的那一档 */
  const keys = [].concat(fe.flag || [], fe.any || [], fe.all || []);
  let best = 0;
  for (const k of keys) if (FLAG_WEIGHT[k] && FLAG_WEIGHT[k] > best) best = FLAG_WEIGHT[k];
  if (best) return best;
  const g = (fe.gate !== undefined) ? fe.gate : (ENDING_GATE[fe.end] || 0);
  if (g >= 398) return 6;
  if (g >= 385) return 4;
  return 1;
}
function pickEnding(match) {
  const w = {};
  for (const fe of match) {
    const e = fe.end;
    const x = endingWeight(fe);
    if (!w[e] || x > w[e]) w[e] = x;
  }
  const pool = [];
  for (const k in w) for (let i = 0; i < w[k]; i++) pool.push(k);
  return pool[Math.floor(Math.random() * pool.length)];
}

function afterOutcome() {
  if (G.over) { renderAll(); return; }
  /* 一、事件自带的结局 */
  const lastEv = G.lastPick ? EVENT_BY_ID[String(G.lastPick).split(":")[0]] : null;
  if (lastEv && lastEv.end) {
    finish(typeof lastEv.end === "string" ? lastEv.end : identityEnding());
    renderAll(); return;
  }
  /* 二、走到结算：先看标签结局，再看身份结局 */
  if (G.day >= DAY_END) {
    const pick = flagEndingPick();
    if (pick) { finish(pick); renderAll(); return; }
    finish(typeof identityEnding === "function" ? identityEnding() : "bystander");
    renderAll(); return;
  }
  /* 三、收束点：最后一段按标签结局落定 */
  if (flagEndingCheck()) { renderAll(); return; }
  /* 四、中途死亡 */
  /* 新市民的 heat 死法不是「红色等级」—— §5.4 说他被查的是「来历不明」。 */
    if (G.heat >= LIMITS.heat) { finish(G.originName === "新市民" ? "unlisted" : "arrested"); renderAll(); return; }
  if (G.nerve <= LIMITS.nerve) { finish("broken"); renderAll(); return; }
  if (G.body <= LIMITS.body) { finish("downed"); renderAll(); return; }
  beginTurn();
}

/* ── 结局条件：支持四种写法（向后兼容，旧条目一字不改） ──
   { flag: "x",             end, gate }   有一个旗标就够（原有写法）
   { any:  ["a","b"],       end, gate }   具备其一
   { all:  ["a","b"],       end, gate }   必须同时具备
   { flag: "x", none:["y"], end, gate }   有 x 且没有 y
   判定读「本条自带的 gate」，没有再退回 ENDING_GATE（修掉死字段：
   原写法读 ENDING_GATE[fe.end]，条目自带的 gate 从不生效，
   于是新结局忘了登记 ENDING_GATE 就会 gate=0，在四月就被判出来） */
function endingHit(fe, G) {
  const F = G.flags || [];
  const has1 = function (k) { return has(F, k); };
  if (fe.flag && !has1(fe.flag)) return false;
  if (fe.any && !fe.any.some(has1)) return false;
  if (fe.all && !fe.all.every(has1)) return false;
  if (fe.none && fe.none.some(has1)) return false;
  return true;
}

function flagEndingPick() {
  const m = [];
  for (const fe of FLAG_ENDINGS) {
    const g = (fe.gate !== undefined) ? fe.gate : (ENDING_GATE[fe.end] || 0);
    if (g > G.day) continue;                            /* 还没到那天，不能判 */
    if (endingHit(fe, G)) m.push(fe);
  }
  if (!m.length) return null;
  return pickEnding(m);
}

function runEvent(e) {
  if (!e) { beginTurn(); return; }
  /* 透镜：同一件事，按身份取对应版本的正文、标题与选项 */
  e = resolveLens(e);
  /* 时代变体：再按当前时代取「后来变成什么样」。顺序＝先身份、后时代。 */
  e = resolveEraLens(e);
  /* 卡片日期＝这一步开始时的日子（先记下来，再推进时间）
     这样卡面日期与事件叙述必然一致，不会出现"卡片显示结算后日期"的问题 */
  G.cardDay = G.day;
  const era = eraOf(G.day);
  let step = pickInt(era.cost[0], era.cost[1]);
  if (G.dayPush) { step += G.dayPush; G.dayPush = 0; }
  G.day = Math.min(DAY_END, G.day + step);
  /* 新市民的嫌疑回得更快：他的卡池比宪兵薄（42 张 vs 74 张），
     同一张卡按档重复的次数更多，每次重复都会再加一遍顶层与选项的 heat。
     实测峰值中位数顶到上限 130（宪兵 84），致死率 55%（宪兵 11%）。 */
  G.heat = Math.max(0, G.heat - ((G.originName === "新市民") ? 7 : 6));
  /* 新市民（新人）回气更快。§5.4：新人的危险不是枪口，是关系 ——
     他的主要死法该是 heat（被查出来历）与立场（两边都不认），不该是心气。
     实测：按宪兵的 +6，他会有 55% 死于心气耗尽，与设计不符。
     原因不是某一张卡，而是结构：宪兵的选项里常有回气项（他有"可以不那么干"的余地），
     而新市民每一场都只能在"难"和"更难"之间选。 */
  const nerveUp = (G.originName === "新市民") ? 10 : 6;
  G.nerve = clamp(G.nerve + nerveUp, 0, 100);
  G.body = clamp(G.body + 6, 0, 100);
  G.turn++; G.rolls++;
  resolveEvent(e);
  G.slot = { kind: "命途" };
  const ch = hasChoices(e);
  if (ch) {
    G.choice = { eventId: e.id, options: ch };
    renderAll();
    return;
  }
  afterOutcome();
}

function beginTurn() {
  if (G.over) return;
  G.choice = null;
  /* 新市民的 heat 死法不是「红色等级」—— §5.4 说他被查的是「来历不明」。 */
    if (G.heat >= LIMITS.heat) { finish(G.originName === "新市民" ? "unlisted" : "arrested"); renderAll(); return; }
  if (G.queue && G.queue.length) {
    const id = G.queue.shift();
    G.queue = null;
    G.slot = { kind: "命途 · 连锁" };
    /* 连锁事件同样只能出现一次，否则会与 runEvent 的结算相互抵触 */
    if (!EVENT_BY_ID[id]) { G.queue = null; renderAll(); beginTurn(); return; }
    G.used[id] = true;
    renderAll();
    busy = true;
    setTimeout(function () { busy = false; runEvent(EVENT_BY_ID[id]); }, 20);
    return;
  }
  G.slot = { kind: (G.turn === 0 ? "开局" : dateLabel(G.day)) + "·命途" };
  renderAll();
}

function turnRoll() {
  if (busy || G.over || G.choice) return;

  const anc = pendingAnchor();
  if (anc) {
    const slot0 = G.slot.kind;
    G.slot = { kind: slot0 };
    G.lastPick = anc.id;
    commit();
    G.lastRoll = { kind: G.slot.kind };
    /* 这里必须抬 busy：锚点走的是另一条分支，原先漏了它，
       结果是转盘还在转（3.2 秒）而引擎不设防 —— 玩家在这期间点一下，
       就会再启动一次转盘，两张卡同时结算，锚点卡还会被反复地重跑。 */
    busy = true;
    $("altar").hidden = false;
    renderWheel(computeSpokes([{ e: anc, w: 1 }]));
    renderAll();
    spinTo(anc, function () { busy = false; runEvent(anc); });
    return;
  }
  const cands = candidates();
  if (!cands.length) {
    /* 本时段没卡了：借用任何时段的无事卡。
       无事卡就是拿来重复的 —— 宁可重复它，也绝不结束游戏，
       更不让有内容的卡重复出现。 */
    const pool = EVENTS.filter(function (e) {
      return e.identity && [].concat(e.identity).indexOf(G.originName) >= 0 &&
             e.title === "这一旬没有事";
    });
    if (pool.length) {
      pool.sort(function (a, b) {
        return ((G.repCount || {})[a.id] || 0) - ((G.repCount || {})[b.id] || 0);
      });
      const idle = pool[0];
      commit(); G.lastPick = idle.id; runEvent(idle); return;
    }
    commit(); finish("short"); renderAll(); return;
  }
  const sp = computeSpokes(cands);
  if (!sp.winner) sp.winner = weightedPick(cands);
  const slotKind = G.slot.kind;
  /* 本转的候选一并记下，撤回后重转时保证结果必然不同 */
  const ids = [sp.winner.id];
  for (const id of G.rejected.all) ids.push(id);
  commit();
  G.dec++;
  G.lastRejected = { ids: ids };
  G.lastRoll = { kind: slotKind };
  busy = true;
  $("altar").hidden = false;
  renderWheel(sp);
  renderAll();
  spinTo(sp, function () {
    busy = false;
    runEvent(sp.winner);
  });
}

function doChoice(idx) {
  if (busy || G.over || !G.choice) return;
  const opt = G.choice.options[idx];
  if (!opt) return;
  commit();
  const c = opt.c;
  const body = typeof c.body === "function" ? c.body(G) : (c.body || "（无记载）");
  const delta = typeof c.delta === "function" ? c.delta(G) : c.delta;
  const shown = applyDelta(delta);
  const added = addFlags(typeof c.flags === "function" ? c.flags(G) : c.flags);
  delFlags(typeof c.flagsOff === "function" ? c.flagsOff(G) : c.flagsOff);
  if (c.rare) G.rare++;
  const quote = c.quote ? (typeof c.quote === "function" ? c.quote(G) : c.quote) : null;
  pushCard("choice", "抉择 · " + dateLabel(G.cardDay || G.day), c.title || opt.label,
    body, shown, added, quote);
  G.chosenCount++;
  const evId = G.choice.eventId;
  G.choice = null;
  G.lastPick = evId + ":" + idx;
  if (c.end) { finish(typeof c.end === "string" ? c.end : "nameless"); renderAll(); return; }
  if (c.chain) G.queue = Array.isArray(c.chain) ? c.chain.slice() : [c.chain];
  afterOutcome();
}

/* 把某个结果记入拒绝表：撤回过的结果此后再不出现，
   重转同一转盘时也必然给出与上次不同的结果。 */
function rejectResult(id) {
  if (!id) return;
  if (!G.rejected) G.rejected = { all: [] };
  if (!G.rejected.all) G.rejected.all = [];
  if (!has(G.rejected.all, id)) G.rejected.all.push(id);
  if (!G.lastRejected) G.lastRejected = { ids: [] };
  if (!G.lastRejected.ids) G.lastRejected.ids = [];
  if (!has(G.lastRejected.ids, id)) G.lastRejected.ids.push(id);
}

/* 撤回到某个决策点之前 */
function undo() {
  if (!canUndo()) return;
  const wasOver = G.over;
  const curDec = G.dec;
  const rolledId = G.choice
    ? G.choice.eventId
    : (G.lastPick ? String(G.lastPick).split(":")[0] : null);

  let guard = 0;
  do {
    restore(undoStack.pop());
  } while (undoStack.length && guard++ < 20 &&
           (G.dec === curDec || (G.choice && G.dec < curDec)));

  G.undos++;
  if (!wasOver) rejectResult(rolledId);
  busy = false;
  renderAll();
}

function finish(endingId) {
  /* 找不到就退回「旁人」——原来是取结局池的最后一条（那是「倒下」），
     身份结局缺失时会静默给出一个完全不相干的结局。 */
  /* short ＝"这个身份还没有内容"的开发期兜底，不该有玩家可见文本，显式别名到 bystander「旁人」 */
  const wantId = (endingId === "short") ? "bystander" : endingId;
  const end = ENDINGS.filter(function (e) { return e.id === wantId; })[0]
    || ENDINGS.filter(function (e) { return e.id === "bystander"; })[0]
    || ENDINGS[ENDINGS.length - 1];
  G.over = true;
  G.endingId = end.id;
  renderAll();
}

/* ── 渲染 ── */
function renderBars() {
  const el = $("bars");
  if (!G) { el.hidden = true; return; }
  el.hidden = false;
  let h = "";
  for (const a of ATTRS) {
    const raw = Math.round(Number(G[a.k]) || 0);      /* 真实值：可能超出范围 */
    const v = clamp(raw, 0, a.max);                    /* 条形宽度用它，仍夹在范围内 */
    const over = raw > a.max;                          /* 超出上限：数字照实显示，后面加 ＋ */
    const warn = (a.k === "heat" && v >= 85) || (a.k === "nerve" && v <= 25) ||
                 (a.k === "body" && v <= 25);
    const pct = a.k === "cash" ? clamp(v / 60 * 100, 0, 100)
      : (a.k === "heat" ? clamp(v / 130 * 100, 0, 100) : v);
    h += '<div class="bar' + (warn ? " warn" : "") + '"><div class="row"><span>' + a.label +
      "</span><b" + (over ? ' style="color:var(--red)"' : "") + ">" + raw +
      (over ? "＋" : "") + "</b></div>" +
      '<div class="track"><div class="fill ' + a.cls + '" style="width:' + pct + '%"></div></div></div>';
  }
  h += '<div class="bar"><div class="row"><span>此刻</span><b>' + monthLabel(G.day) + "</b></div>" +
    '<div class="track"><div class="fill f-month" style="width:' +
    clamp((G.day + 1) / (DAY_END + 1) * 100, 0, 100) + '%"></div></div></div>';
  h += '<div class="bar"><div class="row"><span>转数</span><b>' + G.turn + "</b></div>" +
    '<div class="track"><div class="fill f-favor" style="width:' + clamp(G.turn * 7, 0, 100) + '%"></div></div></div>';
  el.innerHTML = h;
}

function renderLog() {
  const el = $("log");
  el.innerHTML = "";
  for (const c of G.chronicle) {
    const d = document.createElement("div");
    d.className = "card " + (c.cls || "roll");
    let h = '<div class="tag">' + c.tag + "</div><h3>" + c.title + "</h3>";
    h += c.paras.map(function (p) { return "<p>" + p + "</p>"; }).join("");
    if (c.quote) h += '<div class="quote">' + c.quote + "</div>";
    if ((c.deltas && c.deltas.length) || (c.flags && c.flags.length)) {
      h += '<div class="deltas">';
      for (const x of (c.deltas || [])) {
        const meta = ATTRS.filter(function (a) { return a.k === x.k; })[0] || { label: x.k };
        /* 嫌疑越多越危险，与身体/心气相反：它的「涨」用红（down）、「落」用绿（up）。 */
    const chipUp = (x.k === "heat") ? (x.v < 0) : (x.v > 0);
    h += '<span class="chip ' + (chipUp ? "up" : "down") + '">' + meta.label + " " +
          (x.v > 0 ? "+" : "") + x.v + "</span>";
      }
      for (const f of (c.flags || [])) h += '<span class="chip flag">标签 · ' + f + "</span>";
      h += "</div>";
    }
    d.innerHTML = h;
    el.appendChild(d);
  }
}

function buildEpitaph() {
  const end = ENDINGS.filter(function (e) { return e.id === G.endingId; })[0] || {};
  const L = [];
  L.push("《" + G.name + "命途卷宗》");
  L.push("身份　" + G.originName + "　地区　" + (G.region || "市区"));
  L.push("时间　" + dateLabel(G.day) + "　终局　" + (end.name || "不明"));
  L.push("────────────────────");
  for (const c of G.chronicle) {
    L.push("【" + c.tag + "】" + c.title);
    const first = String((c.paras && c.paras[0]) || "").replace(/<[^>]+>/g, "");
    L.push("　　" + first.slice(0, 46) + (first.length > 46 ? "…" : ""));
  }
  L.push("────────────────────");
  L.push("标签留存：" + (G.flags.length ? G.flags.join(" · ") : "无"));
  L.push(THEME.epitaphTail);
  return L.join("\n");
}

function renderFinale() {
  const el = $("finale");
  if (!G || !G.over) { el.innerHTML = ""; return; }
  const end = ENDINGS.filter(function (e) { return e.id === G.endingId; })[0] || ENDINGS[ENDINGS.length - 1];
  /* body 可以是字符串，也可以是段落数组；两种都要吃得下 */
  let body = typeof end.body === "function" ? end.body(G) : end.body;
  if (typeof body === "string") body = [body];
  if (!Array.isArray(body)) body = [""];
  el.innerHTML =
    '<div class="finale">' +
    '<div class="verdict">判 决 书</div>' +
    "<h2>" + end.name + "</h2>" +
    '<div class="rank">' + end.rank + "</div>" +
    body.map(function (p) { return "<p>" + p + "</p>"; }).join("") +
    (end.quote ? '<div class="quote">' + end.quote + "</div>" : "") +
    '<div class="epitaph">' + buildEpitaph() + "</div>" +
    '<div class="scoreline">' +
    "<div>历时<b>" + (G.day + 1) + " 日</b></div>" +
    "<div>转数<b>" + G.turn + " 转</b></div>" +
    "<div>抉择<b>" + G.chosenCount + " 次</b></div>" +
    "<div>撤回<b>" + G.undos + " 次</b></div>" +
    "<div>立场 / 嫌疑<b>" + G.stance + " / " + G.heat + "</b></div>" +
    "<div>人望 / 心气<b>" + G.favor + " / " + G.nerve + "</b></div>" +
    "<div>身体 / 钱<b>" + G.body + " / " + G.cash + "</b></div>" +
    "</div>" +
    '<div class="note">留存标签：' + (G.flags.length ? G.flags.join(" · ") : "无") + "</div>" +
    "</div>";
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderControls() {
  const el = $("controls");
  const inner = $("controls-inner");
  const hint = $("hint");
  if (!G) { el.hidden = true; return; }
  el.hidden = false;
  let h = "";
  if (G.over) {
    h += '<button class="primary" onclick="restart()">重 新 转 生</button>';
    h += '<button class="ghost" onclick="shareEpitaph()">复制命途卷宗</button>';
    hint.textContent = "本局结束。撤回键已封存。";
  } else if (busy) {
    h += "<button disabled>轮 盘 转 动 中 …</button>";
    hint.textContent = "指针停下之前，什么都还没发生。";
  } else if (G.choice) {
    h += G.choice.options.map(function (o, i) {
      return '<button class="primary" onclick="doChoice(' + i + ')">' + o.label + "</button>";
    }).join("");
    h += '<button class="ghost" onclick="undo()"' + (canUndo() ? "" : " disabled") +
      ">撤 回 上 一 步</button>";
    hint.textContent = "抉择由你。抉择之后的，不归你。";
  } else {
    h += '<button class="primary" onclick="turnRoll()">转 动 命 途 之 轮</button>';
    h += '<button class="ghost" onclick="undo()"' + (canUndo() ? "" : " disabled") +
      ">撤 回 上 一 步</button>";
    hint.textContent = "已撤回 " + G.undos + " 次。撤回后重转同一转盘，结果必定与上次不同。";
  }
  inner.innerHTML = h;
}

function renderAll() {
  if (!G) return;
  $("altar").hidden = !(G.chronicle.length > 1);
  renderBars();
  renderLog();
  renderFinale();
  renderControls();
  applySpokeNames();
}

/* ── 开场 ── */
let selectedOrigin = PLAYABLE_ORIGINS[0];

function renderIntro() {
  $("finale").innerHTML = "";
  $("bars").hidden = true;
  $("altar").hidden = true;
  $("log").innerHTML =
    '<div class="intro">' +
    "<h2>" + THEME.introTitle.split("").join(" ") + "</h2>" +
    '<p class="verse">' + THEME.introVerse + "</p>" +
    '<div class="fields"><div><label>姓名</label>' +
    '<input id="in-name" maxlength="12" placeholder="无名者" /></div></div>' +
    '<div style="font-size:12px;letter-spacing:.2em;color:var(--faint);margin:10px 0 2px">选 择 出 身</div>' +
    '<div class="origins" id="origins"></div>' +
        '<div class="mech"><div class="mh">这一局可以中途结束</div>' +
    '<div>嫌疑满了 —— 有人来带你走</div>' +
    '<div>心气见底 —— 你先停下来，没有人会注意</div>' +
    '<div>身体垮了 —— 你倒在半路上</div>' +
    '<div class="mf">其余的事，年底一并结算。</div></div>' +
'<div class="note">' + THEME.introNote + "</div>" +
    "</div>";
  const list = $("origins");
  const playable = ORIGINS.filter(function (o) { return PLAYABLE_ORIGINS.indexOf(o.id) >= 0; });
  const all = playable.concat([{
    id: RANDOM_ORIGIN_ID, name: THEME.randomName,
    desc: THEME.randomDesc,
    trait: "随机出身 · 随机标签",
  }]);
  all.forEach(function (o) {
    const d = document.createElement("div");
    d.className = "origin" + (o.id === selectedOrigin ? " sel" : "");
    d.innerHTML = "<b>" + o.name + "</b><span>" + o.desc + "</span>" +
      '<div class="trait">' + (o.trait || "随机出身 · 随机标签") + "</div>";
    d.onclick = function () {
      selectedOrigin = o.id;
      for (const x of Array.from(list.children)) x.classList.remove("sel");
      d.classList.add("sel");
    };
    list.appendChild(d);
  });
  $("controls").hidden = false;
  $("controls-inner").innerHTML = '<button class="primary" onclick="startGame()">开 卷</button>';
  $("hint").textContent = THEME.introHint;
}

function startGame() {
  /* 必须在这里建索引：链式事件的队列是按 id 取事件的，
     索引没建就会取到 undefined，事件会静默丢失 */
  indexEvents();
  const input = $("in-name");
  const nm = (input && input.value || "").trim();
  G = newGame(nm, selectedOrigin);
  undoStack = [];
  const o = ORIGINS.filter(function (x) { return x.id === G.originId; })[0] || {};
  const pro = [G.name + "，身份：" + G.originName + "。"].concat(THEME.prologue);
  G.chronicle.push({
    cls: "omen", tag: THEME.archivists, title: THEME.register,
    paras: pro, deltas: [], flags: [],
  });
  renderAll();
  beginTurn();
}

function restart() {
  undoStack = [];
  G = null;
  selectedOrigin = PLAYABLE_ORIGINS[0];
  renderIntro();
}

function shareEpitaph() {
  const t = buildEpitaph();
  const hint = $("hint");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      function () { hint.textContent = "命途卷宗已复制到剪贴板。"; },
      function () { hint.textContent = "复制失败，请手动选中卷宗文本。"; });
  } else {
    hint.textContent = "此浏览器不支持自动复制。";
  }
}

window.addEventListener("DOMContentLoaded", function () {
  indexEvents();
  renderIntro();
});

/* ── 悬浮跳转按钮：顶部时「回到底部」，其余时候「回到顶部」 ──
   注意：本脚本在 <button id="jump"> **之前**执行，所以必须等 DOM 就绪再取元素
   （第一版就是同步取元素、拿到 null 直接 return，导致点击完全没反应）。 */
(function () {
  function init() {
    const btn = document.getElementById("jump");
    if (!btn) return;
    const bar = document.querySelector(".controls");
    function atTop() { return (window.scrollY || window.pageYOffset || 0) <= 8; }
    function pageH() {
      const b = document.body || {}, d = document.documentElement || {};
      return Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
    }
    function sync() {
      /* 量出底栏实际高度：窄屏上它会换行变高，写死数值就会压住选项卡 */
      const h = bar ? Math.round(bar.getBoundingClientRect().height) : 88;
      document.documentElement.style.setProperty("--ctl-h", h + "px");
      btn.hidden = pageH() <= (window.innerHeight || 0) + 40;
      const top = atTop();
      btn.dataset.dir = top ? "down" : "up";
      btn.textContent = top ? "回到底部" : "回到顶部";
    }
    btn.addEventListener("click", function (ev) {
      ev.preventDefault();
      const to = atTop() ? pageH() : 0;
      try { window.scrollTo({ top: to, behavior: "smooth" }); }
      catch (e) { window.scrollTo(0, to); }
    });
    window.addEventListener("scroll", sync, { passive: true });
    window.addEventListener("resize", sync);
    sync();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>

<script>
/* ══ 始终停在最底：每出现一张新卡片，就自动滚到底 ══
   监听 #log 的子节点变化，**引擎一行都不用改**（将来它怎么改渲染都不影响这里）。
   为什么"滚到文档最底"正好：.wrap 底部留了 108px 内边距给固定底栏，
   所以滚到底时最后一张卡片正好停在底栏上方，不会被压住。
   要撤销：删掉这一整段 <script> 即可。 */
(function () {
  function toBottom() {
    var b = document.body || {}, d = document.documentElement || {};
    var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
    try { window.scrollTo({ top: h, behavior: "smooth" }); }
    catch (e) { window.scrollTo(0, h); }
  }
  var timer = null;
  function schedule() {
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(toBottom, 40);   /* 等这一帧布局完成再量高度 */
  }
  function init() {
    var log = document.getElementById("log");
    if (!log) return;
    if (window.MutationObserver) {
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          if (muts[i].addedNodes && muts[i].addedNodes.length) { schedule(); return; }
        }
      }).observe(log, { childList: true });
    } else {
      /* 极老的浏览器：退化成定时比对子节点数 */
      var n = log.childNodes.length;
      window.setInterval(function () {
        if (log.childNodes.length !== n) { n = log.childNodes.length; schedule(); }
      }, 800);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<script>
/* ══ 把选项栏的真实高度量进 --ctl-h（内容随之让路）══
   栏的内容每回合都会变，所以除了 resize 还要在栏上挂观察器重新量。
   与悬浮按钮那段脚本各管各的，设的是同一个变量、同一个值，不冲突。 */

    window.addEventListener("orientationchange", sync);
    if (window.MutationObserver && bar) {
      new MutationObserver(sync).observe(bar, { childList: true, subtree: true });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

<script>
/* ══ 三条死亡线的预警（方案一：让"贴线"看得见）══
   阈值来自实测，不是拍脑袋：
     heat ≥ 65 · nerve ≤ 45 · body ≤ 80
   —— 这三档能让 91–100% 的死亡在死前至少 3 回合就亮灯（见 _tests/probe_death.js）。
   heat 还有约 9% 是从线下一步跨到死的，可视化盖不住；那属于单次增减的量级问题。

   做法：引擎每回合会重画这些条（元素被换掉、class 也随之丢失），
   所以这里在【重画之后】补上 class：观察 #bars 的子节点变化 ＋ 点击后补一次
   ＋ 一秒钟兜一次底。三种路子都只做一件事：读 G，给条加/去 .danger。 */
(function () {
  var RULES = {
    heat:  function (v) { return v >= 65; },
    nerve: function (v) { return v <= 45; },
    body:  function (v) { return v <= 80; }
  };
  function sync() {
    if (typeof G === "undefined" || !G || G.over) return;
    for (var k in RULES) {
      if (!RULES.hasOwnProperty(k)) continue;
      var el = document.querySelector(".f-" + k);
      if (!el) continue;
      var v = G[k];
      if (typeof v !== "number") continue;
      if (RULES[k](v)) { el.classList.add("danger"); } else { el.classList.remove("danger"); }
    }
  }
  function init() {
    sync();
    window.addEventListener("resize", sync);
    var bars = document.getElementById("bars");
    if (window.MutationObserver && bars) {
      new MutationObserver(sync).observe(bars, { childList: true, subtree: true });
    }
    document.addEventListener("click", function () { window.setTimeout(sync, 60); }, true);
    window.setInterval(sync, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
