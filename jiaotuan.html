<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黑柩·命途转盘 · 启示录教团国</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='9' fill='%2307070a'/><path d='M32 4c2.6 16.5 11 24.9 28 28-17 3.1-25.4 11.5-28 28-2.6-16.5-11-24.9-28-28 17-3.1 25.4-11.5 28-28z' fill='%23c9a24a'/></svg>">
<style>
:root{
  --bg:#07070a; --bg2:#0c0c11; --panel:#12121a;
  --line:#242430; --line2:#33333f;
  --ink:#d9d4ca; --dim:#8a8579; --faint:#5c584f;
  --gold:#c9a961; --gold2:#8a713a;
  --blood:#8e2a2a; --blood2:#c04a4a;
  --bone:#e8e2d4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#17141c 0%,#0a0a0e 45%,#060608 100%);
  color:var(--ink); min-height:100vh;min-height:100dvh;
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
  font-size:16px; line-height:1.85; letter-spacing:.02em;
  -webkit-text-size-adjust:100%;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:22px 16px 110px}

/* ── 页头 ── */
.head{text-align:center;padding:14px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.head h1{margin:0;font-size:clamp(20px,4.6vw,30px);letter-spacing:.42em;text-indent:.42em;
  color:var(--bone);font-weight:400;text-shadow:0 0 22px rgba(201,169,97,.18)}
.head .sub{margin-top:8px;font-size:12px;letter-spacing:.3em;color:var(--faint)}
.head .sigil{margin:14px auto 4px;width:52px;height:52px;position:relative;opacity:.85}
.head .sigil::before{content:"";position:absolute;inset:0;border:1px solid var(--gold2);transform:rotate(45deg)}
.head .sigil::after{content:"";position:absolute;inset:9px;background:var(--gold);opacity:.5;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}

/* ── 副栏 ── */
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px 14px;
  background:linear-gradient(180deg,#101017,#0c0c12);border:1px solid var(--line);
  border-radius:3px;padding:12px 14px;margin-bottom:20px}
.bar{font-size:12px;letter-spacing:.06em}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim)}
.bar .row b{color:var(--ink);font-weight:400;font-size:13px}
.bar .track{height:3px;background:#1d1d26;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;width:0;transition:width .5s ease}
.f-faith{background:linear-gradient(90deg,#6b5a2a,#c9a961)}
.f-sin{background:linear-gradient(90deg,#3a1414,#c04a4a)}
.f-fame{background:linear-gradient(90deg,#243046,#7f9dc4)}
.f-reason{background:linear-gradient(90deg,#2a1a3a,#9b7fc4)}
.f-life{background:linear-gradient(90deg,#3a2418,#c98a5a)}
.bar.warn .row b{color:var(--blood2)}

/* ── 命途卷宗 ── */
.log{display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,#111118,#0d0d13);border:1px solid var(--line);
  border-left:2px solid var(--line2);border-radius:2px;padding:15px 17px;
  animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.card .tag{font-size:11px;letter-spacing:.22em;color:var(--faint);margin-bottom:7px}
.card h3{margin:0 0 9px;font-size:17px;font-weight:400;color:var(--bone);letter-spacing:.06em}
.card p{margin:0 0 9px;color:#c6c1b6;text-align:justify}
.card p:last-child{margin-bottom:0}
.card.roll{border-left-color:var(--gold2)}
.card.choice{border-left-color:#4a5a7a}
.card.omen{border-left-color:#5a3a7a;background:linear-gradient(180deg,#141020,#0d0a14)}
.card.death{border-left-color:var(--blood)}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.chip{font-size:11.5px;letter-spacing:.05em;padding:2px 8px;border:1px solid var(--line2);
  border-radius:2px;color:var(--dim)}
.chip.up{color:#c9a961;border-color:#4d3f1e;background:rgba(201,169,97,.05)}
.chip.down{color:#c07070;border-color:#4d2020;background:rgba(192,74,74,.05)}
.chip.flag{color:#9b8fc4;border-color:#3a2f52;background:rgba(155,143,196,.05)}
.quote{margin:10px 0 0;padding:8px 12px;border-left:2px solid var(--gold2);
  background:rgba(201,169,97,.035);color:#bdb4a0;font-size:14.5px}

/* ── 转盘 ── */
.altar{margin:24px 0 18px;text-align:center}
.altar .caption{font-size:12px;letter-spacing:.28em;color:var(--faint);margin-bottom:12px}
.wheelbox{position:relative;width:min(330px,78vw);aspect-ratio:1;margin:0 auto;--r:130px}
@media(max-width:430px){.wheelbox{--r:calc(min(330px,78vw) * 0.395)}}
.wheel{
  position:absolute;inset:8%;border-radius:50%;
  border:1px solid var(--line2);
  background:radial-gradient(circle at 50% 42%,#191922 0%,#0d0d13 68%,#08080c 100%);
  box-shadow:0 0 40px rgba(0,0,0,.9),inset 0 0 30px rgba(0,0,0,.85);
  transform:rotate(0deg);
  transition:transform 3.1s cubic-bezier(.12,.62,.05,1);
}
.wheel::after{content:"";position:absolute;inset:34%;border-radius:50%;
  border:1px solid var(--gold2);background:#0a0a0f;box-shadow:inset 0 0 14px rgba(201,169,97,.14)}
.spoke{position:absolute;left:50%;top:50%;width:1px;height:calc(var(--r) + 6px);
  background:linear-gradient(180deg,rgba(70,70,86,.15),rgba(70,70,86,.75));
  transform-origin:50% 0;pointer-events:none}
.spoke i{display:none}
.slabel{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.slabel i{position:absolute;transform:translate(-50%,-50%);font-style:normal;white-space:nowrap;
  font-size:11.5px;letter-spacing:.06em;color:#a49c8c;max-width:72px;overflow:hidden;
  text-overflow:clip;text-align:center;line-height:1.2}
.slabel.landed i{color:var(--gold);font-size:13px;font-weight:400;
  text-shadow:0 0 14px rgba(201,169,97,.55)}
.pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;z-index:4;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:20px solid var(--gold);filter:drop-shadow(0 0 6px rgba(201,169,97,.5))}
.ringnum{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);font-size:10.5px;
  letter-spacing:.3em;color:var(--faint)}
.wheelbox.spinning .pointer{animation:tick .09s steps(2) infinite}
@keyframes tick{50%{transform:translateX(-50%) translateY(2px)}}

/* ── 控件 ── */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:linear-gradient(180deg,rgba(7,7,10,.6),rgba(7,7,10,.97) 45%);
  backdrop-filter:blur(7px);border-top:1px solid var(--line);padding:13px 16px 15px}
.controls .inner{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
button{font-family:inherit;font-size:14.5px;letter-spacing:.1em;cursor:pointer;
  background:linear-gradient(180deg,#191922,#111118);color:var(--ink);
  border:1px solid var(--line2);border-radius:2px;padding:11px 20px;
  transition:all .22s ease}
button:hover:not(:disabled){border-color:var(--gold2);color:var(--bone);
  box-shadow:0 0 16px rgba(201,169,97,.14)}
button:disabled{opacity:.32;cursor:not-allowed}
button.primary{border-color:var(--gold2);color:var(--gold);
  background:linear-gradient(180deg,#1d1a12,#12100a)}
button.primary:hover:not(:disabled){box-shadow:0 0 24px rgba(201,169,97,.24)}
button.ghost{font-size:13px;padding:9px 15px;color:var(--dim)}
button.danger{border-color:#4d2020;color:#c07070}
.hint{max-width:1000px;margin:9px auto 0;text-align:center;font-size:11.5px;
  letter-spacing:.09em;color:var(--faint)}

/* ── 开场 ── */
.intro{background:linear-gradient(180deg,#101017,#0b0b11);border:1px solid var(--line);
  border-radius:3px;padding:24px 24px 20px;text-align:center}
.intro h2{margin:0 0 6px;font-size:21px;font-weight:400;letter-spacing:.24em;color:var(--bone)}
.intro .verse{color:var(--dim);font-size:14.5px;margin:0 0 20px;letter-spacing:.05em}
.intro .fields{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-bottom:18px}
.intro label{font-size:12px;letter-spacing:.18em;color:var(--faint);display:block;
  text-align:left;margin-bottom:5px}
.intro input{font-family:inherit;font-size:15px;background:#0a0a0f;color:var(--ink);
  border:1px solid var(--line2);border-radius:2px;padding:9px 12px;width:190px;letter-spacing:.1em}
.intro input:focus{outline:none;border-color:var(--gold2)}
.origins{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:9px;
  margin:16px 0 4px;text-align:left}
.origin{border:1px solid var(--line);border-radius:2px;padding:12px 13px;cursor:pointer;
  background:#0d0d13;transition:all .2s ease}
.origin:hover{border-color:var(--gold2);background:#131018}
.origin.sel{border-color:var(--gold);background:#17140d;box-shadow:0 0 18px rgba(201,169,97,.16)}
.origin b{display:block;font-weight:400;color:var(--bone);font-size:15px;letter-spacing:.08em}
.origin span{display:block;font-size:12px;color:var(--faint);line-height:1.6;margin-top:5px}
.origin .trait{font-size:11.5px;color:var(--gold2);margin-top:7px;letter-spacing:.06em}

/* ── 结局 ── */
.finale{margin-top:24px;border:1px solid var(--gold2);border-radius:3px;padding:26px 24px;
  background:radial-gradient(ellipse at 50% 0%,#1b1710 0%,#0b0b11 70%);
  animation:rise .9s ease both}
.finale .verdict{font-size:11.5px;letter-spacing:.42em;color:var(--gold2);text-align:center}
.finale h2{margin:10px 0 4px;text-align:center;font-size:clamp(22px,5vw,30px);font-weight:400;
  letter-spacing:.16em;color:var(--gold);text-shadow:0 0 30px rgba(201,169,97,.22)}
.finale .rank{text-align:center;font-size:12.5px;letter-spacing:.24em;color:var(--faint);margin-bottom:18px}
.finale p{color:#c6c1b6;text-align:justify}
.epitaph{white-space:pre-wrap;background:#0a0a0f;border:1px solid var(--line);border-radius:2px;
  padding:14px 16px;font-size:13.5px;color:#b3ada0;line-height:1.9;margin-top:16px;
  max-height:340px;overflow:auto}
.scoreline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.scoreline div{border:1px solid var(--line);border-radius:2px;padding:9px 11px;font-size:12px;color:var(--dim)}
.scoreline div b{display:block;color:var(--bone);font-size:17px;font-weight:400;letter-spacing:.06em}

.note{font-size:12px;color:var(--faint);text-align:center;margin-top:16px;letter-spacing:.08em}
@media(max-width:560px){
  body{font-size:15.2px}
  .wrap{padding:14px 12px 118px}
  .card{padding:13px 14px}
  .head h1{letter-spacing:.3em;text-indent:.3em}
}

/* ══ 移动端补丁（追加在最后；只改观感与命中区，不动剧情、数值与判定）══
   桌面浏览器上这些几乎看不出差别，但手机上差别很大：
   双击不再有 300ms 延迟、点击不闪灰块、按钮有 44px 命中区、
   触摸时有 :active 反馈（原来只有 :hover，触摸设备上从不触发）、
   底部固定控制条不会被 iPhone 的小白条压住。 */
html,body{-webkit-text-size-adjust:100%;}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button,[role="button"],.choice,.origin,.tab,
a.btn,.opt{cursor:pointer;touch-action:manipulation;min-height:44px;
  -webkit-tap-highlight-color:transparent;}
button:active:not(:disabled),.choice:active,.origin:active,.tab:active,
a.btn:active,.opt:active{filter:brightness(.93);}
.controls{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));}
.jump{bottom:calc(var(--ctl-h, 96px) + 14px + env(safe-area-inset-bottom,0px));}

  /* ── 悬浮跳转按钮（配色照教团：金 ＋ 暗底）──
     位置由 JS 量出的底栏高度 --ctl-h 决定，窗口缩小、底栏换行变高时也不会压住选项。 */
  .jump{position:fixed;right:12px;z-index:11;padding:8px 13px;
    font-size:12px;letter-spacing:.06em;color:var(--gold);font-family:inherit;
    background:rgba(18,18,26,.92);border:1px solid var(--gold2);border-radius:20px;
    cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.5);backdrop-filter:blur(4px);
    transition:background .15s,color .15s;
    bottom:calc(88px + 14px);
    bottom:calc(var(--ctl-h, 88px) + 14px + env(safe-area-inset-bottom, 0px))}
  .jump:hover{background:#1c1a24;color:var(--bone)}
  .jump[hidden]{display:none}
  /* 窄屏与移动端：缩成 42px 圆钮，只留箭头，尽量不挡选项 */
  @media (max-width:560px){
    .jump{width:42px;height:42px;padding:0;border-radius:50%;font-size:0;
      right:10px;opacity:.92;
      bottom:calc(96px + 8px);
      bottom:calc(var(--ctl-h, 96px) + 8px + env(safe-area-inset-bottom, 0px))}
    .jump::before{content:"\2191";font-size:16px;line-height:42px;display:block}
    .jump[data-dir="down"]::before{content:"\2193"}
  }

    /* 空隙按「固定底栏高度 ＋ 悬浮按钮高度」一起算，让页底整块停在按钮上方（按钮停在 底栏+14px，高约 42px）*/


/* ══ 选项栏可以高，但内容必须让路 ══
   原来是写死 108–118px 的底边距，而选项栏的高度由内容决定（长选项时远超那个数），
   于是最后几行正文被压在栏下面、滚到底也露不出来。
   现在改成跟着量出来的 --ctl-h 走；再给栏一个上限高度并在栏内自己滚动，
   真遇到超长选项它滚自己，而不是吃掉整屏。 */
.wrap{padding-bottom:calc(var(--ctl-h, 116px) + 22px)}
.controls{max-height:56vh;max-height:56dvh;overflow:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="sigil"></div>
    <h1>黑柩·命途转盘</h1>
    <div class="sub">卷 二 · 启 示 录 教 团 国</div>
  </header>

  <section class="bars" id="bars" hidden></section>

  <section class="altar" id="altar" hidden>
    <div class="caption" id="altar-caption">命 途 之 轮</div>
    <div class="wheelbox" id="wheelbox">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div id="spokes"></div>
        <div id="spoke-labels"></div>
      </div>
      <div class="ringnum">十 二 签 · 一 命</div>
    </div>
  </section>

  <main class="log" id="log"></main>
  <div id="finale"></div>

</div>

<div class="controls" id="controls" hidden>
  <div class="inner" id="controls-inner"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
"use strict";

/* 篇目数据在下方注入；这两张表由各篇覆盖 */
let FLAG_ENDINGS = [];
let ENDING_GATE = {};

/* ═══════════════════════════════════════════════════════════════
   黑柩 · 命途转盘 —— 启示录教团国篇（精简版 · 卷一）
   玩法：转盘决定命运，关键节点由玩家抉择。
   允许撤回；撤回后重转同一转盘，结果必定与上次不同。
   ═══════════════════════════════════════════════════════════════ */

/* ── 零、工具 ── */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = (o) => JSON.parse(JSON.stringify(o));
const pickInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const has = (arr, t) => arr.indexOf(t) >= 0;

/* 确定性随机（用于同一转盘内的视觉分扇，不影响结果） */
function mulberry(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6d2b79f5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}
/* 由 id 串确定地取一个「签」，用于把中性票分配到具体事件上 */
function tieBreak(ids, seed, salt) {
  const rnd = mulberry(hash(seed + "|" + salt) ^ 0x9e3779b9);
  const arr = ids.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ── 一、教团国词条资料（摘自《黑柩设定集·第一版》） ── */

/* 主题配置：换一个势力篇，只改这里与数据区即可 */
const THEME = {
  title: "黑柩·命途转盘",
  subtitle: "卷 二 · 启 示 录 教 团 国",
  archivists: "序 · 档案司",
  register: "登记在册",
  bornAt: "启示录教团国 · 平民区",
  fileWord: "档案司",
  introTitle: "报 上 名 号",
  introVerse: "顺民的名字会被记进教团的册子。<br>你也可以不留名——册子照样有你的位置。",
  introNote: "选定出身即定下你的第一份档案。此后一切由轮盘与你的抉择共同写完。",
  introHint: "启示录教团国的档案司正在等一个名字。",
  randomName: "听凭安排",
  randomDesc: "你不选。教团替你选，诸神替你选，或者什么也不选。",
  prologue: [
    "教团国把治下的人分作两类：教士与顺民。档案司在你出生的第三日就替你勾好了其中一栏，墨迹至今未干。",
    "此后你的一生将被记录在案。记录的方式是：每一转抽一次签。",
    "凡你所遇之事，皆由轮盘落定。落定之后你可以撤回一次——撤回之后，命运会换一个结果给你，但绝不重复已经发生过的那一个。",
  ],
  epitaphTail: "死因记述由中央教团档案司核定，异议不予受理。",
};

const TERMS = {
  state: "启示录教团国",
  church: "中央教团",
  faith: "启示录教",
  pope: "教皇渊",
  head: "陛下",
  lay: "顺民",
  clergy: "教士",
  rite: "受洗",
  exam: "教法考",
  student: "教生",
  election: "民选教士",
  chosen: "神选教士",
  ward: "教士监护",
  doctrine: "《启示教典》",
  law: "《启示录国教法》",
  interim: "《临时约法》",
  flag: "黑星旗",
  sect: "承罪学社",
  scripture: "《启示之书》",
  trial: "宗教裁判",
  saints: "十三圣人",
  council: "圣人会议",
  heaven: "圣地",
};

/* ── 二、出身与阶层 ── */

const ORIGINS = [
  {
    id: "farmhand",
    name: "神赐土地上的农家子",
    desc: "父母耕种教团分下的神赐土地。你会在田垄与祷词之间长大，饿不着，也走不远。",
    trait: "初始标签：顺民、忠实、无名",
    mods: { faith: 12, fame: -6, reason: -4, sin: 0, life: 0 },
    flags: ["顺民", "农家", "忠实"],
  },
  {

function eraOf(age) {
  for (const e of ERAS) if (age < e.age[1]) return e;
  return ERAS[ERAS.length - 1];

function eraName(age) { return eraOf(age).name; }

function snapshot() {
  return clone({
    age: G.age, faith: G.faith, sin: G.sin, fame: G.fame, reason: G.reason, life: G.life,

}

function commit() { undoStack.push(snapshot()); }
function canUndo() { return !busy && undoStack.length > 0 && G && !G.over; }

/* ── 候选与权重 ── */
function weightOf(e) {
  let w = typeof e.weight === "function" ? e.weight(G) : (e.weight === undefined ? 10 : e.weight);
  return (typeof w === "number" && w > 0) ? w : 0;
}
function candidates() {
  const out = [];
  for (const e of EVENTS) {
    if (G.used[e.id]) continue;
    if (e.era && e.era.indexOf(eraOf(G.age).idx) < 0) continue;
    if (e.req && !e.req(G)) continue;
    const w = weightOf(e);
    if (w <= 0) continue;
    /* 全局排除：被撤回过的结果永不再来 */
    if (has(G.rejected.all, e.id)) continue;
    /* 本轮重转排除：撤回后重转同一转盘，结果必不相同 */
    if (G.lastRejected && has(G.lastRejected.ids, e.id)) continue;
    out.push({ e: e, w: w });
  }
  return out;
}
function weightedPick(cands) {
  const total = cands.reduce(function (s, c) { return s + c.w; }, 0);
  if (total <= 0) return cands[0].e;
  let r = Math.random() * total;
  for (const c of cands) { r -= c.w; if (r <= 0) return c.e; }
  return cands[cands.length - 1].e;
}

/* ── 视觉：十二签转盘 ── */
const N_SECTORS = 12;
const UNIFORM_MAX = 12;

function computeSpokes(cands) {
  const sorted = cands.slice().sort(function (a, b) {
    return b.w - a.w || (a.e.id < b.e.id ? -1 : 1);
  });
  const N = N_SECTORS;
  const labels = [];

  if (sorted.length <= UNIFORM_MAX) {
    /* 每根签都写清名字：指针指向哪一根，就是哪一件事 */
    const slots = [];
    for (let i = 0; i < sorted.length; i++) slots.push(sorted[i].e);
    for (let i = 0; slots.length < N; i++) slots.push(sorted[i % sorted.length].e);
    const land = Math.floor(Math.random() * slots.length);
    return { labels: slots, land: land, winner: slots[land], showLabels: true };
  }

  /* 事件多于十二件时只写扇位，指针落在哪一扇就按权重定签 */
  const total = sorted.reduce(function (s, c) { return s + c.w; }, 0);
  const alloc = sorted.map(function (c) { return c.w / total * N; });
  const base = alloc.map(function (x) { return Math.floor(x); });
  let rem = N - base.reduce(function (s, x) { return s + x; }, 0);
  const order = alloc.map(function (x, i) { return { i: i, frac: x - Math.floor(x) }; })
    .sort(function (a, b) { return b.frac - a.frac || a.i - b.i; });
  for (let k = 0; k < order.length && rem > 0; k++, rem--) base[order[k].i]++;

  const seq = [];
  const buckets = sorted.map(function (c, i) { return { e: c.e, n: base[i], w: c.w }; });
  let guard = 0;
  while (seq.length < N && guard++ < 400) {
    for (const b of buckets) {
      if (b.n > 0 && seq.length < N) { seq.push(b.e); b.n--; }
    }
  }
  while (seq.length < N) seq.push(sorted[0].e);
  const land = Math.floor(Math.random() * N);
  return { labels: seq, land: land, winner: seq[land], showLabels: true };
}

function wheelLabel(e) {
  const t = e.short || e.title || e.id;
  return t.length > 4 ? t.slice(0, 4) : t;

  const box = $("wheelbox");

  $("spokes").innerHTML = "";

  w.style.transition = "none";
  w.style.transform = "rotate(0deg)";
  w.__angle = 0;
  const step = 360 / N_SECTORS;
  for (let i = 0; i < N_SECTORS; i++) {
    const d = document.createElement("div");
    d.className = "spoke";
    d.style.transform = "rotate(" + (i * step + step / 2) + "deg)";
    $("spokes").appendChild(d);
  }
  /* 标签：贴着外圈横排摆放，随盘旋转、但始终直立可读 */
  for (let i = 0; i < N_SECTORS; i++) {
    const mid = i * step + step / 2;          /* 扇位中线角度，0° 在正上方 */
    const el = document.createElement("div");
    el.className = "slabel";
    el.style.transform = "rotate(" + mid + "deg) translateY(calc(var(--r) * -1 + 14px))";
    const inner = document.createElement("i");
    inner.style.transform = "rotate(" + (-mid) + "deg)";
    inner.textContent = wheelLabel(sp.labels[i]);
    el.appendChild(inner);
    $("spoke-labels").appendChild(el);
  }
  box.classList.add("spinning");
  $("altar-caption").textContent = "命 途 之 轮 · " + G.slot.kind;
}

function spinTo(sp, done) {
  const w = $("wheel");
  const box = $("wheelbox");
  const step = 360 / N_SECTORS;
  const jitter = (Math.random() - 0.5) * step * 0.5;
  /* 指针在正上方(0°)。要让第 land 扇的中线停在 0°，转盘需旋转 -(land*step+step/2) */
  const base = -((sp.land * step + step / 2) + jitter);
  const laps = 4 + Math.floor(Math.random() * 3);
  const cur = w.__angle || 0;
  const next = cur + (((base - cur) % 360) + 360) % 360 + 360 * laps;
  w.__angle = next;
  w.style.transition = "transform 3.1s cubic-bezier(.12,.62,.05,1)";
  w.style.transform = "rotate(" + next + "deg)";
  setTimeout(function () {
    box.classList.remove("spinning");
    const kids = $("spoke-labels").children;
    if (kids[sp.land]) {
      kids[sp.land].classList.add("landed");
      const inner = kids[sp.land].querySelector("i");
      /* 让中签的那一签亮出来、并保持水平可读 */
      inner.textContent = sp.winner.short || sp.winner.title;
      inner.style.transform = "rotate(" + (sp.land * step + step / 2) + "deg)";
    }
    done();
  }, 3260);
}

/* ── 结算 ── */
function applyDelta(d) {
  const shown = [];
  if (!d) return shown;
  for (const a of ATTRS) {
    const v = d[a.k];
    if (typeof v === "number" && v !== 0) {
      G[a.k] = clamp(G[a.k] + v, 0, 100);
      shown.push({ k: a.k, v: v });
    }
  }
  return shown;
}
function addFlags(list) {
  const added = [];
  if (!list) return added;
  for (const f of list) if (addFlag(f)) added.push(f);
  return added;
}
function delFlags(list) { if (list) G.flags = G.flags.filter(function (f) { return list.indexOf(f) < 0; }); }

function pushCard(cls, tag, title, paras, deltas, flagsAdded, quote) {
  G.chronicle.push({
    cls: cls, tag: tag, title: title,
    paras: Array.isArray(paras) ? paras : [paras],
    deltas: deltas || [], flags: flagsAdded || [], quote: quote || null,
  });
}

function resolveEvent(e) {
  const body = typeof e.body === "function" ? e.body(G) : e.body;
  const delta = typeof e.delta === "function" ? e.delta(G) : e.delta;
  const shown = applyDelta(delta);
  const added = addFlags(typeof e.flags === "function" ? e.flags(G) : e.flags);
  delFlags(typeof e.flagsOff === "function" ? e.flagsOff(G) : e.flagsOff);
  G.used[e.id] = true;
  G.lastPick = e.id;
  if (e.rare) G.rare++;
  const quote = e.quote ? (typeof e.quote === "function" ? e.quote(G) : e.quote) : null;
  pushCard("roll", "第 " + G.turn + " 转 · " + eraName(G.age), e.title,
    body, shown, added, quote);
}

function hasChoices(e) {
  if (!e.choices) return null;
  const list = typeof e.choices === "function" ? e.choices(G) : e.choices;
  const out = [];
  for (const c of list) if (!c.req || c.req(G)) out.push({ label: c.label, c: c });
  return out.length ? out : null;
}

  erasure_exe: 36, variant: 38, cell: 38, tribunal: 38, erased: 38,
  sacrifice: 40, delivered: 40, shut: 40, master: 40, holywar: 38,
  moled: 42, stalker: 44, voice: 44, falsegod: 42, allocation: 44,
  estate_n: 44, priest: 46, records: 46, mask: 46, donor: 48,
  river: 46, deed: 46, nameless: 47, follow: 40, tomb: 44,
  flu: 48, possessed: 44, faint: 46, shut2: 48,
  saint: 42, numbered: 44, apex: 50, number: 42, conclusion: 50,
};

function flagEndingCheck() {
  if (G.over) return false;
  if (has(G.flags, "不死")) return false;
  if (G.age < 25 && G.turn < 8) return false;
  const late = G.age >= 50;
  const match = [];
  for (const fe of FLAG_ENDINGS) {
    if (G.age < (fe.from || 0)) continue;
    const gate = ENDING_GATE[fe.end] || 0;
    if (G.age < gate) continue;
    if (!has(G.flags, fe.flag)) continue;
    match.push(fe);
  }
  if (!match.length) return false;
  /* 一轮一转只兑现一次机会；晚年更急 */
  if (Math.random() > (late ? 0.4 : 0.26)) return false;
  match.sort(function (a, b) { return (b.prio || 0) - (a.prio || 0); });
  const pick = match[Math.floor(Math.random() * Math.min(2, match.length))];
  finish(pick.end);
  return true;
}

function afterOutcome() {
  if (G.over) { renderAll(); return; }
  /* 事件自带终局 */
  const lastEv = G.lastPick ? EVENT_BY_ID[String(G.lastPick).split(":")[0]] : null;
  if (lastEv && lastEv.end) {
    finish(typeof lastEv.end === "string" ? lastEv.end : "nameless");
    renderAll();
    return;
  }
  if (flagEndingCheck()) { renderAll(); return; }
  if (has(G.flags, "不死")) { beginTurn(); return; }
  if (G.life <= 0) {
    /* 寿数耗尽：年轻时算意外，活到老了才算寿终 */
    finish(G.age >= 55 ? "short" : "sudden");
    renderAll();
    return;
  }
  const era = eraOf(G.age);
  if (Math.random() < era.death) { finish("sudden"); renderAll(); return; }
  beginTurn();
}

function runEvent(e) {
  if (!e) { beginTurn(); return; }
  const y = pickInt(eraOf(G.age).cost[0], eraOf(G.age).cost[1]);
  G.age += y;
  G.life = clamp(G.life - y, 0, 100);
  G.turn++; G.rolls++;
  resolveEvent(e);
  G.slot = { kind: "命途" };
  const ch = hasChoices(e);
  if (ch) {
    G.choice = { eventId: e.id, options: ch };
    renderAll();
    return;
  }
  afterOutcome();
}

function beginTurn() {
  if (G.over) return;
  G.choice = null;
  if (G.life <= 0 && !has(G.flags, "不死")) { finish("short"); renderAll(); return; }
  if (G.queue && G.queue.length) {
    const id = G.queue.shift();
    G.queue = null;
    G.slot = { kind: "命途 · 连锁" };
    /* 连锁事件同样只能出现一次，否则会与 runEvent 的结算相互抵触 */
    if (EVENT_BY_ID[id]) G.used[id] = true;
    renderAll();
    busy = true;
    setTimeout(function () { busy = false; runEvent(EVENT_BY_ID[id]); }, 20);
    return;
  }
  G.slot = { kind: (G.turn === 0 ? "出身" : eraName(G.age)) + "·命途" };
  renderAll();
}

function turnRoll() {
  if (busy || G.over || G.choice) return;
  const cands = candidates();
  if (!cands.length) { commit(); finish("short"); renderAll(); return; }
  const sp = computeSpokes(cands);
  if (!sp.winner) sp.winner = weightedPick(cands);
  const slotKind = G.slot.kind;
  /* 本转的候选一并记下，撤回后重转时保证结果必然不同 */
  const ids = [sp.winner.id];
  for (const id of G.rejected.all) ids.push(id);
  commit();
  G.dec++;
  G.lastRejected = { ids: ids };
  G.lastRoll = { kind: slotKind };
  busy = true;
  $("altar").hidden = false;
  renderWheel(sp);
  renderAll();
  spinTo(sp, function () {
    busy = false;
    runEvent(sp.winner);
  });
}

function doChoice(idx) {
  if (busy || G.over || !G.choice) return;
  const opt = G.choice.options[idx];
  if (!opt) return;
  commit();
  const c = opt.c;
  const body = typeof c.body === "function" ? c.body(G) : (c.body || "（无记载）");
  const delta = typeof c.delta === "function" ? c.delta(G) : c.delta;
  const shown = applyDelta(delta);
  const added = addFlags(typeof c.flags === "function" ? c.flags(G) : c.flags);
  delFlags(typeof c.flagsOff === "function" ? c.flagsOff(G) : c.flagsOff);
  if (c.rare) G.rare++;
  const quote = c.quote ? (typeof c.quote === "function" ? c.quote(G) : c.quote) : null;
  pushCard("choice", "抉择 · " + eraName(G.age), c.title || opt.label,
    body, shown, added, quote);
  G.chosenCount++;
  const evId = G.choice.eventId;
  G.choice = null;
  G.lastPick = evId + ":" + idx;
  if (c.end) { finish(typeof c.end === "string" ? c.end : "nameless"); renderAll(); return; }
  if (c.chain) G.queue = Array.isArray(c.chain) ? c.chain.slice() : [c.chain];
  afterOutcome();
}

/* 把某个结果记入拒绝表：撤回过的结果此后再不出现，
   重转同一转盘时也必然给出与上次不同的结果。 */
function rejectResult(id) {
  if (!id) return;
  if (!G.rejected) G.rejected = { all: [] };
  if (!G.rejected.all) G.rejected.all = [];
  if (!has(G.rejected.all, id)) G.rejected.all.push(id);
  if (!G.lastRejected) G.lastRejected = { ids: [] };
  if (!G.lastRejected.ids) G.lastRejected.ids = [];
  if (!has(G.lastRejected.ids, id)) G.lastRejected.ids.push(id);
}

/* 撤回到某个决策点之前 */
function undo() {
  if (!canUndo()) return;
  const wasOver = G.over;
  const curDec = G.dec;
  const rolledId = G.choice
    ? G.choice.eventId
    : (G.lastPick ? String(G.lastPick).split(":")[0] : null);

  let guard = 0;
  do {
    restore(undoStack.pop());
  } while (undoStack.length && guard++ < 20 &&
           (G.dec === curDec || (G.choice && G.dec < curDec)));

  G.undos++;
  if (!wasOver) rejectResult(rolledId);
  busy = false;
  renderAll();
}

function finish(endingId) {
  const end = ENDINGS.filter(function (e) { return e.id === endingId; })[0] || ENDINGS[ENDINGS.length - 1];
  G.over = true;
  G.endingId = end.id;
  renderAll();
}

function buildEpitaph() {
  const end = ENDINGS.filter(function (e) { return e.id === G.endingId; })[0] || {};
  const L = [];
  L.push("《" + G.name + "命途卷宗》");
  L.push("籍贯　" + G.born + "　出身　" + G.originName);
  L.push("享年　" + G.age + " 岁　终局　" + (end.name || "不明"));
  L.push("────────────────────");
  for (const c of G.chronicle) {
    L.push("【" + c.tag + "】" + c.title);
    const first = String((c.paras && c.paras[0]) || "").replace(/<[^>]+>/g, "");
    L.push("　　" + first.slice(0, 46) + (first.length > 46 ? "…" : ""));
  }
  L.push("────────────────────");
  L.push("标签留存：" + (G.flags.length ? G.flags.join(" · ") : "无"));
  L.push(THEME.epitaphTail);
  return L.join("\n");
}

  el.innerHTML =
    '<div class="finale">' +
    '<div class="verdict">命 途 终 卷</div>' +
    "<h2>" + end.name + "</h2>" +
    '<div class="rank">' + end.rank + "</div>" +
    body.map(function (p) { return "<p>" + p + "</p>"; }).join("") +
    (end.quote ? '<div class="quote">' + end.quote + "</div>" : "") +
    '<div class="epitaph">' + buildEpitaph() + "</div>" +
    '<div class="scoreline">' +
    "<div>在世<b>" + G.age + " 年</b></div>" +
    "<div>转数<b>" + G.turn + " 转</b></div>" +
    "<div>抉择<b>" + G.chosenCount + " 次</b></div>" +
    "<div>撤回<b>" + G.undos + " 次</b></div>" +
    "<div>信仰 / 罪责<b>" + G.faith + " / " + G.sin + "</b></div>" +
    "<div>声名 / 理智<b>" + G.fame + " / " + G.reason + "</b></div>" +
    "</div>" +
    '<div class="note">留存标签：' + (G.flags.length ? G.flags.join(" · ") : "无") + "</div>" +
    "</div>";
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderControls() {
  const el = $("controls");
  const inner = $("controls-inner");
  const hint = $("hint");
  if (!G) { el.hidden = true; return; }
  el.hidden = false;
  let h = "";
  if (G.over) {
    h += '<button class="primary" onclick="restart()">重 新 转 生</button>';
    h += '<button class="ghost" onclick="shareEpitaph()">复制命途卷宗</button>';
    hint.textContent = "本局结束。撤回键已封存。";
  } else if (busy) {
    h += "<button disabled>轮 盘 转 动 中 …</button>";
    hint.textContent = "指针停下之前，什么都还没发生。";
  } else if (G.choice) {
    h += G.choice.options.map(function (o, i) {
      return '<button class="primary" onclick="doChoice(' + i + ')">' + o.label + "</button>";
    }).join("");
    h += '<button class="ghost" onclick="undo()"' + (canUndo() ? "" : " disabled") +
      ">撤 回 上 一 步</button>";
    hint.textContent = "抉择由你。抉择之后的，不归你。";
  } else {
    h += '<button class="primary" onclick="turnRoll()">转 动 命 途 之 轮</button>';
    h += '<button class="ghost" onclick="undo()"' + (canUndo() ? "" : " disabled") +
      ">撤 回 上 一 步</button>";
    hint.textContent = "已撤回 " + G.undos + " 次。撤回后重转同一转盘，结果必定与上次不同。";
  }
  inner.innerHTML = h;
}

function renderAll() {
  if (!G) return;
  $("altar").hidden = !(G.chronicle.length > 1);
  renderBars();
  renderLog();
  renderFinale();
  renderControls();
}

/* ── 开场 ── */
let selectedOrigin = RANDOM_ORIGIN_ID;

function renderIntro() {
  $("finale").innerHTML = "";
  $("bars").hidden = true;
  $("altar").hidden = true;
  $("log").innerHTML =
    '<div class="intro">' +
    "<h2>" + THEME.introTitle.split("").join(" ") + "</h2>" +
    '<p class="verse">' + THEME.introVerse + "</p>" +
    '<div class="fields"><div><label>姓名</label>' +
    '<input id="in-name" maxlength="12" placeholder="无名者" /></div></div>' +
    '<div style="font-size:12px;letter-spacing:.2em;color:var(--faint);margin:10px 0 2px">选 择 出 身</div>' +
    '<div class="origins" id="origins"></div>' +
    '<div class="note">' + THEME.introNote + "</div>" +
    "</div>";
  const list = $("origins");
  const all = ORIGINS.concat([{
    id: RANDOM_ORIGIN_ID, name: THEME.randomName,
    desc: THEME.randomDesc,
    trait: "随机出身 · 随机标签",
  }]);
  all.forEach(function (o) {
    const d = document.createElement("div");
    d.className = "origin" + (o.id === selectedOrigin ? " sel" : "");
    d.innerHTML = "<b>" + o.name + "</b><span>" + o.desc + "</span>" +
      '<div class="trait">' + (o.trait || "随机出身 · 随机标签") + "</div>";
    d.onclick = function () {
      selectedOrigin = o.id;
      for (const x of Array.from(list.children)) x.classList.remove("sel");
      d.classList.add("sel");
    };
    list.appendChild(d);
  });
  $("controls").hidden = false;
  $("controls-inner").innerHTML = '<button class="primary" onclick="startGame()">开 卷</button>';
  $("hint").textContent = THEME.introHint;
}

function startGame() {
  const input = $("in-name");
  const nm = (input && input.value || "").trim();
  G = newGame(nm, selectedOrigin);
  undoStack = [];
  const o = ORIGINS.filter(function (x) { return x.id === G.originId; })[0] || {};
  const pro = [G.name + "，生于" + G.born + "。父母身份：" + G.originName + "。"].concat(THEME.prologue);
  G.chronicle.push({
    cls: "omen", tag: THEME.archivists, title: THEME.register,
    paras: pro, deltas: [], flags: [],
  });
  renderAll();
  beginTurn();
}

function restart() {
  undoStack = [];
  G = null;
  selectedOrigin = RANDOM_ORIGIN_ID;
  renderIntro();
}

function shareEpitaph() {
  const t = buildEpitaph();
  const hint = $("hint");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(
      function () { hint.textContent = "命途卷宗已复制到剪贴板。"; },
      function () { hint.textContent = "复制失败，请手动选中卷宗文本。"; });
  } else {
    hint.textContent = "此浏览器不支持自动复制。";
  }
}

window.addEventListener("DOMContentLoaded", function () {
  indexEvents();
  renderIntro();
});


/* ── 悬浮跳转按钮：顶部时「回到底部」，其余时候「回到顶部」 ──
   注意：本脚本在 <button id="jump"> **之前**执行，所以必须等 DOM 就绪再取元素
   （北沙第一版就是同步取元素、拿到 null 直接 return，导致点击完全没反应）。 */
(function () {
  function init() {
    const btn = document.getElementById("jump");
    if (!btn) return;
    const bar = document.querySelector(".controls");
    function atTop() { return (window.scrollY || window.pageYOffset || 0) <= 8; }
    function pageH() {
      const b = document.body || {}, d = document.documentElement || {};
      return Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
    }
    function sync() {
      /* 量出底栏实际高度：窄屏上它会换行变高，写死数值就会压住选项卡 */
      const h = bar ? Math.round(bar.getBoundingClientRect().height) : 88;
      document.documentElement.style.setProperty("--ctl-h", h + "px");
      btn.hidden = pageH() <= (window.innerHeight || 0) + 40;
      const top = atTop();
      btn.dataset.dir = top ? "down" : "up";
      btn.textContent = top ? "回到底部" : "回到顶部";
    }
    btn.addEventListener("click", function (ev) {
      ev.preventDefault();
      const to = atTop() ? pageH() : 0;
      try { window.scrollTo({ top: to, behavior: "smooth" }); }
      catch (e) { window.scrollTo(0, to); }
    });
    window.addEventListener("scroll", sync, { passive: true });
    window.addEventListener("resize", sync);
    sync();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>





<button id="jump" class="jump" type="button" aria-label="跳到页面另一端">回到顶部</button>

<script>
/* ══ 始终停在最底：每出现一张新卡片，就自动滚到底 ══
   监听 #log 的子节点变化，**引擎一行都不用改**（将来它怎么改渲染都不影响这里）。
   为什么"滚到文档最底"正好：.wrap 底部留了 108px 内边距给固定底栏，
   所以滚到底时最后一张卡片正好停在底栏上方，不会被压住。
   要撤销：删掉这一整段 <script> 即可。 */
(function () {
  function toBottom() {
    var b = document.body || {}, d = document.documentElement || {};
    var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
    try { window.scrollTo({ top: h, behavior: "smooth" }); }
    catch (e) { window.scrollTo(0, h); }
  }
  var timer = null;
  function schedule() {
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(toBottom, 40);   /* 等这一帧布局完成再量高度 */
  }
  function init() {
    var log = document.getElementById("log");
    if (!log) return;
    if (window.MutationObserver) {
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          if (muts[i].addedNodes && muts[i].addedNodes.length) { schedule(); return; }
        }
      }).observe(log, { childList: true });
    } else {
      /* 极老的浏览器：退化成定时比对子节点数 */
      var n = log.childNodes.length;
      window.setInterval(function () {
        if (log.childNodes.length !== n) { n = log.childNodes.length; schedule(); }
      }, 800);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<script>
/* ══ 把选项栏的真实高度量进 --ctl-h（内容随之让路）══
   栏的内容每回合都会变，所以除了 resize 还要在栏上挂观察器重新量。
   与悬浮按钮那段脚本各管各的，设的是同一个变量、同一个值，不冲突。 */
(function () {
  function sync() {
    var bar = document.querySelector(".controls");
    if (!bar) return;
    var h = Math.round(bar.getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty("--ctl-h", h + "px");
  }
  function init() {
    var bar = document.querySelector(".controls");
    sync();
    window.addEventListener("resize", sync);
    window.addEventListener("orientationchange", sync);
    if (window.MutationObserver && bar) {
      new MutationObserver(sync).observe(bar, { childList: true, subtree: true });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
